<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagrams viewer</title>
<style>
  :root { --bg: #f4f5f7; --panel: #ffffff; --line: #dfe3e8; --ink: #1f2933; --muted: #6b7785; --accent: #2d6cdf; --err: #c0392b; --warn: #b7791f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 360px; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  header .grow { flex: 1; }
  #status { color: var(--muted); }
  button, select { font: inherit; padding: 3px 9px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  #time { width: 240px; }
  #clock { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; }
  main { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #stage, #overlay { position: absolute; inset: 16px; display: flex; align-items: center; justify-content: center; }
  #stage svg { max-width: 100%; max-height: 100%; width: auto; height: auto; box-shadow: 0 1px 4px rgba(0,0,0,.12); background: #fff; }
  #overlay { pointer-events: none; }
  #overlay svg { max-width: 100%; max-height: 100%; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
  section { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  section h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #clicked { font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .muted { color: var(--muted); }
  .container { margin: 4px 0 10px; }
  .container .head { display: flex; gap: 6px; align-items: baseline; margin-bottom: 4px; }
  .container .owner { font-family: ui-monospace, Menlo, monospace; font-weight: 600; }
  .container .buttons { display: flex; flex-wrap: wrap; gap: 4px; }
  .diag { padding: 5px 6px; border-radius: 4px; cursor: default; border-left: 3px solid var(--warn); margin-bottom: 4px; background: #fbfaf6; }
  .diag.error { border-left-color: var(--err); background: #fcf5f4; }
  .diag .code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
  .diag .where { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .diag:hover { outline: 1px solid var(--accent); }
  #empty { padding: 40px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title">diagrams</h1>
  <button id="play" title="Play or pause the scene clock (space)">Play</button>
  <input id="time" type="range" min="0" max="1" step="0.01" value="0" title="Scene clock">
  <span id="clock">0.00 s</span>
  <span class="grow"></span>
  <span id="status">loading…</span>
  <button id="save" title="Download the canonical document, with any patches">Save</button>
</header>
<main>
  <div id="stage"><div id="empty">Loading…</div></div>
  <div id="overlay"></div>
</main>
<aside>
  <section><h2>Clicked</h2><div id="clicked" class="muted">Click a node to see its path.</div></section>
  <section><h2>States</h2><div id="states" class="muted">No state containers.</div></section>
  <section><h2>Diagnostics</h2><div id="diagnostics" class="muted">None.</div></section>
</aside>
<script type="module" src="viewer.js"></script>
</body>
</html>

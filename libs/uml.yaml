# UML class diagrams: classes, notes and the usual relations.
# Expects a theme with the tokens surface, stroke, ink and muted (themes/paper.yaml has them).
format: diagrams/0.1
title: UML
styles:
  box: {fill: "=theme.surface", stroke: "=theme.stroke", stroke_width: 1.5}
templates:
  class:
    description: A class box with its name, attributes and operations.
    params:
      name: {type: string, description: Class name}
      stereotype: {type: string, default: "", description: "Shown above the name, in guillemets"}
      abstract: {type: boolean, default: false}
      attributes: {type: list, keyed: true, item: {type: string}, default: [], description: "'- name: Type' items"}
      operations: {type: list, keyed: true, item: {type: string}, default: [], description: "'- name: \"(args): Result\"' items"}
    exports:
      anchors: [north, south, east, west]
      parts: [header, attributes, operations]
      tokens: [surface, stroke, ink, muted]
    body:
      layout: column
      align: stretch
      children:
        - id: header
          layout: stack
          align: stretch
          children:
            - {shape: rect, width: 0, height: 0, style: box}
            - layout: column
              align: center
              padding: {x: 14, y: 8}
              children:
                - {if: "params.stereotype != ''", shape: text, text: "='«' + params.stereotype + '»'", font_size: 12, fill: "=theme.muted"}
                - {shape: text, text: "=params.name", font_size: 16, fill: "=theme.ink"}
                - {if: params.abstract, shape: text, text: "{abstract}", font_size: 11, fill: "=theme.muted"}
        - id: attributes
          layout: stack
          align: stretch
          children:
            - {shape: rect, width: 0, height: 0, style: box}
            - layout: column
              padding: {x: 10, y: 6}
              gap: 3
              children:
                - for_each: params.attributes
                  as: attr
                  id: attribute
                  do: {shape: text, text: "=attr.key + ': ' + attr.value", font_size: 13, fill: "=theme.ink"}
        - id: operations
          layout: stack
          align: stretch
          children:
            - {shape: rect, width: 0, height: 0, style: box}
            - layout: column
              padding: {x: 10, y: 6}
              gap: 3
              children:
                - for_each: params.operations
                  as: op
                  id: operation
                  do: {shape: text, text: "=op.key + op.value", font_size: 13, fill: "=theme.ink"}

  note:
    description: A note with free text.
    params:
      text: {type: string}
      width: {type: number, default: 180}
    exports:
      tokens: [ink, muted]
    body:
      layout: stack
      align: stretch
      children:
        - {shape: rect, width: 0, height: 0, fill: "#fff8d6", stroke: "=theme.muted", stroke_width: 1}
        - layout: column
          padding: 10
          children:
            - {shape: text, text: "=params.text", width: "=params.width - 20", font_size: 12, fill: "=theme.ink", wrap: true}

  relation:
    description: "A connector between two elements, with an optional label and multiplicities. In a graph container (layered, tree), 'route: layout' follows the route the container supplies."
    params:
      from: {type: path}
      to: {type: path}
      label: {type: string, default: ""}
      from_mult: {type: string, default: ""}
      to_mult: {type: string, default: ""}
      head: {type: enum, values: [none, arrow, open_arrow, triangle, diamond, open_diamond], default: none}
      tail: {type: enum, values: [none, arrow, open_arrow, triangle, diamond, open_diamond], default: none}
      route: {type: enum, values: [straight, orthogonal, layout], default: orthogonal}
    exports:
      parts: [line]
      tokens: [stroke, muted]
    body:
      children:
        - {shape: connector, id: line, from: "=params.from", to: "=params.to", route: "=params.route", stroke: "=theme.stroke", stroke_width: 1.5, marker_end: "=params.head", marker_start: "=params.tail"}
        - {if: "params.label != ''", shape: text, text: "=params.label", font_size: 12, fill: "=theme.muted", attach: {anchor: south, to: line.label, gap: 4}}
        - {if: "params.from_mult != ''", shape: text, text: "=params.from_mult", font_size: 12, fill: "=theme.muted", attach: {anchor: south_west, to: line.start, gap: -18}}
        - {if: "params.to_mult != ''", shape: text, text: "=params.to_mult", font_size: 12, fill: "=theme.muted", attach: {anchor: south_west, to: line.end, gap: -18}}

  association:
    params: {from: path, to: path, label: {type: string, default: ""}, from_mult: {type: string, default: ""}, to_mult: {type: string, default: ""}, route: {type: enum, values: [straight, orthogonal, layout], default: orthogonal}}
    exports: {parts: [line], tokens: [stroke, muted]}
    body: {use: relation, from: "=params.from", to: "=params.to", label: "=params.label", from_mult: "=params.from_mult", to_mult: "=params.to_mult", route: "=params.route", head: open_arrow}

  aggregation:
    params: {from: path, to: path, label: {type: string, default: ""}, from_mult: {type: string, default: ""}, to_mult: {type: string, default: ""}, route: {type: enum, values: [straight, orthogonal, layout], default: orthogonal}}
    exports: {parts: [line], tokens: [stroke, muted]}
    body: {use: relation, from: "=params.from", to: "=params.to", label: "=params.label", from_mult: "=params.from_mult", to_mult: "=params.to_mult", route: "=params.route", tail: open_diamond}

  composition:
    params: {from: path, to: path, label: {type: string, default: ""}, from_mult: {type: string, default: ""}, to_mult: {type: string, default: ""}, route: {type: enum, values: [straight, orthogonal, layout], default: orthogonal}}
    exports: {parts: [line], tokens: [stroke, muted]}
    body: {use: relation, from: "=params.from", to: "=params.to", label: "=params.label", from_mult: "=params.from_mult", to_mult: "=params.to_mult", route: "=params.route", tail: diamond}

  generalization:
    params: {from: path, to: path, route: {type: enum, values: [straight, orthogonal, layout], default: orthogonal}}
    exports: {parts: [line], tokens: [stroke, muted]}
    body: {use: relation, from: "=params.from", to: "=params.to", route: "=params.route", head: triangle}

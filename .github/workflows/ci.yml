name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # JVM tests and fixtures, plus the browser (JS) target: compiled and its common tests run on Node from milestone 0.
      - run: ./gradlew check --console=plain
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-diffs
          path: fixtures/cases/**/actual.png

# A transition between two layouts of one graph (graph layouts addendum, section 9). The graph is
# not laid out again on every frame: the boxes interpolate, and so do the routes the layout
# supplied, along their length. The label of an edge follows its interpolated route.
format: diagrams/0.1
viewport: {width: 520, height: 420}
styles:
  step: {fill: "#dfe6e9", stroke: "#2d3436", stroke_width: 1.5, corner_radius: 6}
  edge: {stroke: "#2d3436", stroke_width: 1.5, marker_end: arrow}
scene:
  states:
    defaults: {duration: 0.6, ease: linear}
    sequence:
      - id: short
      - id: long
        set: {flow.review.present: true, flow.to_review.present: true, flow.from_review.present: true, flow.direction: right}
  children:
    - id: flow
      at: {x: 30, y: 30}
      layout: layered
      children:
        - {shape: rect, id: draft, width: 100, height: 40, style: step}
        - {shape: rect, id: review, width: 100, height: 40, style: step, present: false}
        - {shape: rect, id: publish, width: 100, height: 40, style: step}
        - {shape: connector, id: to_review, from: draft, to: review, style: edge, present: false}
        - {shape: connector, id: from_review, from: review, to: publish, style: edge, present: false}
        # two points in `short`, a route around `review` in `long`
        - {shape: connector, id: direct, from: draft, to: publish, style: edge}
        - {shape: text, id: note, text: fast track, font_size: 12, fill: "#636e72", attach: {to: direct.label}}

format: diagrams/0.1
viewport: {width: 520, height: 420}
styles:
  step: {fill: "#dfe6e9", stroke: "#2d3436", stroke_width: 1.5, corner_radius: 6}
  edge: {stroke: "#2d3436", stroke_width: 1.5, marker_end: arrow}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  states:
    defaults: {duration: 0.6, ease: linear}
    cumulative: false
    sequence:
      - {id: short}
      - id: long
        set:
          flow.review.present: true
          flow.to_review.present: true
          flow.from_review.present: true
          flow.direction: right
  children:
    - id: flow
      layout: layered
      layer: default
      at: {x: 30, y: 30}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: draft
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 100
          height: 40
        - id: review
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: false
          style: step
          width: 100
          height: 40
        - id: publish
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 100
          height: 40
        - id: to_review
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: false
          style: edge
          from: draft
          to: review
          route: layout
          marker_start: none
        - id: from_review
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: false
          style: edge
          from: review
          to: publish
          route: layout
          marker_start: none
        - id: direct
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: draft
          to: publish
          route: layout
          marker_start: none
        - id: note
          shape: text
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          attach: {to: direct.label}
          text: fast track
          font_size: 12
          fill: "#636e72"
          text_align: start
          wrap: false

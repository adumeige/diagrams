# Hints and options are never dropped silently (graph layouts addendum, section 3): one that the
# layout in charge does not declare is reported as `hint_ignored`, one that contradicts the edges
# as `hint_conflict`. A tree reports the edges that do not fit a tree, and a fixed anchor that faces
# away from the supplied route is reported too. Everything still resolves and draws.
format: diagrams/0.1
viewport: {width: 760, height: 600}
styles:
  step: {fill: "#dfe6e9", stroke: "#2d3436", stroke_width: 1.5, corner_radius: 6}
  edge: {stroke: "#2d3436", stroke_width: 1.5, marker_end: arrow}
scene:
  children:
    - id: strip
      at: {x: 20, y: 20}
      layout: row
      gap: 20
      # an option of the layered and tree layouts
      direction: right
      children:
        # hints of other layouts
        - {shape: rect, id: a, width: 60, height: 30, style: step, rank: first}
        - {shape: rect, id: b, width: 60, height: 30, style: step, pinned: {x: 10, y: 10}}
    # not an edge of a graph container
    - {shape: connector, id: loose, from: strip.a, to: strip.b.north, style: edge, constrain: false, route: orthogonal}
    - id: ranks
      at: {x: 20, y: 100}
      layout: layered
      # an option of the force layout
      seed: 3
      children:
        # edges lead to `two`: it cannot be first
        - {shape: rect, id: one, width: 60, height: 30, style: step, rank: last}
        - {shape: rect, id: two, width: 60, height: 30, style: step, rank: first}
        # an edge joins `two` and `three`: they cannot share a rank
        - {shape: rect, id: three, width: 60, height: 30, style: step, rank: {same_as: two}}
        # `strip.a` is not placed by this container
        - {shape: rect, id: four, width: 60, height: 30, style: step, rank: {same_as: strip.a}}
        # a hint of the force layout
        - {shape: rect, id: five, width: 60, height: 30, style: step, pinned: {x: 0, y: 0}}
        - {shape: connector, id: e1, from: one, to: two, style: edge}
        - {shape: connector, id: e2, from: two, to: three, style: edge}
        # leaves from the top of `three` to go down to `four`
        - {shape: connector, id: e3, from: three.north, to: four, style: edge}
        - {shape: connector, id: e4, from: four, to: five, style: edge}
        # a label is not a node: the hint has nothing to act on
        - {shape: text, id: caption, text: back, font_size: 12, fill: "#636e72", rank: last, attach: {to: e3.label}}
    - id: family
      at: {x: 420, y: 100}
      layout: tree
      children:
        - {shape: rect, id: elder, width: 60, height: 30, style: step}
        - {shape: rect, id: left_child, width: 60, height: 30, style: step}
        - {shape: rect, id: right_child, width: 60, height: 30, style: step}
        - {shape: connector, id: t1, from: elder, to: left_child, style: edge}
        - {shape: connector, id: t2, from: elder, to: right_child, style: edge}
        # a second parent for `right_child`, and a hint of the layered layout
        - {shape: connector, id: t3, from: left_child, to: right_child, style: edge, constrain: false}
        # closes a loop
        - {shape: connector, id: t4, from: right_child, to: elder, style: edge, route: straight}

format: diagrams/0.1
viewport: {width: 760, height: 600}
styles:
  step: {fill: "#dfe6e9", stroke: "#2d3436", stroke_width: 1.5, corner_radius: 6}
  edge: {stroke: "#2d3436", stroke_width: 1.5, marker_end: arrow}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: strip
      layout: row
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      gap: 20
      direction: right
      children:
        - id: a
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: first
          width: 60
          height: 30
        - id: b
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          pinned: {x: 10, y: 10}
          width: 60
          height: 30
    - id: loose
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      style: edge
      from: strip.a
      to: strip.b.north
      route: orthogonal
      constrain: false
      marker_start: none
    - id: ranks
      layout: layered
      layer: default
      at: {x: 20, y: 100}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      seed: 3
      children:
        - id: one
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: last
          width: 60
          height: 30
        - id: two
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: first
          width: 60
          height: 30
        - id: three
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: {same_as: two}
          width: 60
          height: 30
        - id: four
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: {same_as: strip.a}
          width: 60
          height: 30
        - id: five
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          pinned: {x: 0, y: 0}
          width: 60
          height: 30
        - id: e1
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: one
          to: two
          route: layout
          marker_start: none
        - id: e2
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: two
          to: three
          route: layout
          marker_start: none
        - id: e3
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: three.north
          to: four
          route: layout
          marker_start: none
        - id: e4
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: four
          to: five
          route: layout
          marker_start: none
        - id: caption
          shape: text
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          attach: {to: e3.label}
          rank: last
          text: back
          font_size: 12
          fill: "#636e72"
          text_align: start
          wrap: false
    - id: family
      layout: tree
      layer: default
      at: {x: 420, y: 100}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: elder
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 60
          height: 30
        - id: left_child
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 60
          height: 30
        - id: right_child
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 60
          height: 30
        - id: t1
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: elder
          to: left_child
          route: layout
          marker_start: none
        - id: t2
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: elder
          to: right_child
          route: layout
          marker_start: none
        - id: t3
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: left_child
          to: right_child
          route: layout
          constrain: false
          marker_start: none
        - id: t4
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: right_child
          to: elder
          route: straight
          marker_start: none

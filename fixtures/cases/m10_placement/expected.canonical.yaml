format: diagrams/0.1
viewport: {width: 640, height: 420}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: shelf
      layout: row
      layer: default
      at: {x: 30, y: 30}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      gap: 30
      children:
        - id: card
          layout: column
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          padding: {left: 14, top: 24, right: 26, bottom: 12}
          underlay:
            - shape: polygon
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              points:
                - {x: 0, y: 12}
                - {x: 12, y: 0}
                - {x: {ref: host.width}, y: 0}
                - {x: {ref: host.width}, y: {sub: [{ref: host.height}, 12]}}
                - {x: {sub: [{ref: host.width}, 12]}, y: {ref: host.height}}
                - {x: 0, y: {ref: host.height}}
              fill: "#dfe6e9"
              stroke: "#2d3436"
              stroke_width: 1
          overlay:
            - id: badge
              shape: circle
              layer: default
              at: {x: {sub: [{ref: host.width}, 30]}, y: 16}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              radius: 6
              fill: "#d63031"
              stroke: "#000000"
              stroke_width: 1
          children:
            - shape: text
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              text: A box in perspective
              font_size: 14
              fill: "#000000"
              text_align: start
              wrap: false
        - id: plain
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 80
          height: 60
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#2d3436"
          stroke_width: 1
    - id: hub
      shape: rect
      layer: default
      at: {x: 300, y: 230}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffeaa7"
      stroke: "#2d3436"
      stroke_width: 1
    - id: right_box
      shape: rect
      layer: default
      at: {x: 560, y: 230}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#2d3436"
      stroke_width: 1
    - id: left_box
      shape: rect
      layer: default
      at: {x: 40, y: 230}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#2d3436"
      stroke_width: 1
    - id: low_box
      shape: rect
      layer: default
      at: {x: 300, y: 370}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#2d3436"
      stroke_width: 1
    - id: right_way
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: hub
      to: right_box
      route: layout
      marker_start: none
      marker_end: arrow
      stroke: "#2d3436"
      stroke_width: 1
    - id: back_way
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: hub
      to: left_box
      route: layout
      marker_start: none
      marker_end: arrow
      stroke: "#2d3436"
      stroke_width: 1
    - id: down
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: hub
      to: low_box
      route: layout
      marker_start: none
      marker_end: arrow
      stroke: "#2d3436"
      stroke_width: 1
    - id: slant
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: shelf.card.badge
      to: hub
      route: layout
      marker_start: none
      marker_end: arrow
      stroke: "#0984e3"
      stroke_width: 1
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: right_way.label, side: above, gap: 3}
      text: above
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: right_way.label, side: below, gap: 3}
      text: below
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: back_way.label, side: above, gap: 3}
      text: above
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: back_way.label, side: left, gap: 3}
      text: left
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: down.label, side: left, gap: 3}
      text: left
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: down.label, side: right, gap: 3}
      text: right
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: slant.label, side: above, gap: 3}
      text: slanted
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: right_way.start, along: 14, side: above, gap: 2}
      text: "1"
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false
    - shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {to: right_way.end, along: 18, side: above, gap: 2}
      text: 0..*
      font_size: 11
      fill: "#000000"
      text_align: start
      wrap: false

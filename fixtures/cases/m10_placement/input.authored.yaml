# Placement (spec section 6): decorations drawn from the size of their host inside a layout
# container, an overlay part a connector reaches, and labels beside connectors: side above, below,
# left and right on lines going in four directions, and points along a line from its ends.
format: diagrams/0.1
viewport: {width: 640, height: 420}
scene:
  children:
    - id: shelf
      at: {x: 30, y: 30}
      layout: row
      gap: 30
      children:
        - id: card
          layout: column
          padding: {left: 14, top: 24, right: 26, bottom: 12}
          underlay:
            - shape: polygon
              points: [{x: 0, y: 12}, {x: 12, y: 0}, {x: "=host.width", y: 0}, {x: "=host.width", y: "=host.height - 12"}, {x: "=host.width - 12", y: "=host.height"}, {x: 0, y: "=host.height"}]
              fill: "#dfe6e9"
              stroke: "#2d3436"
          overlay:
            - {shape: circle, id: badge, at: {x: "=host.width - 30", y: 16}, radius: 6, fill: "#d63031"}
          children:
            - {shape: text, text: A box in perspective, font_size: 14}
        - {shape: rect, id: plain, width: 80, height: 60, fill: "#ffffff", stroke: "#2d3436"}
    - {shape: rect, id: hub, at: {x: 300, y: 230}, width: 40, height: 40, fill: "#ffeaa7", stroke: "#2d3436"}
    - {shape: rect, id: right_box, at: {x: 560, y: 230}, width: 40, height: 40, fill: "#ffffff", stroke: "#2d3436"}
    - {shape: rect, id: left_box, at: {x: 40, y: 230}, width: 40, height: 40, fill: "#ffffff", stroke: "#2d3436"}
    - {shape: rect, id: low_box, at: {x: 300, y: 370}, width: 40, height: 40, fill: "#ffffff", stroke: "#2d3436"}
    - {shape: connector, id: right_way, from: hub, to: right_box, stroke: "#2d3436", marker_end: arrow}
    - {shape: connector, id: back_way, from: hub, to: left_box, stroke: "#2d3436", marker_end: arrow}
    - {shape: connector, id: down, from: hub, to: low_box, stroke: "#2d3436", marker_end: arrow}
    - {shape: connector, id: slant, from: shelf.card.badge, to: hub, stroke: "#0984e3", marker_end: arrow}
    - {shape: text, text: above, font_size: 11, attach: {to: right_way.label, side: above, gap: 3}}
    - {shape: text, text: below, font_size: 11, attach: {to: right_way.label, side: below, gap: 3}}
    - {shape: text, text: above, font_size: 11, attach: {to: back_way.label, side: above, gap: 3}}
    - {shape: text, text: left, font_size: 11, attach: {to: back_way.label, side: left, gap: 3}}
    - {shape: text, text: left, font_size: 11, attach: {to: down.label, side: left, gap: 3}}
    - {shape: text, text: right, font_size: 11, attach: {to: down.label, side: right, gap: 3}}
    - {shape: text, text: slanted, font_size: 11, attach: {to: slant.label, side: above, gap: 3}}
    - {shape: text, text: "1", font_size: 11, attach: {to: right_way.start, along: 14, side: above, gap: 2}}
    - {shape: text, text: "0..*", font_size: 11, attach: {to: right_way.end, along: 18, side: above, gap: 2}}

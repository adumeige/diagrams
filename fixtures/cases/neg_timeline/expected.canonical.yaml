format: diagrams/0.1
viewport: {width: 200, height: 100}
imports:
  motion: ../../../libs/motion.yaml
  deck: ../../../libs/deck.yaml
  paper: ../../../themes/paper.yaml
base_theme: paper
camera: {zoom: 2, focus: a}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  timeline:
    sequence:
      - {keys: []}
      - {track: a.opacity, keys: [{at: 1, value: 0}, {at: 0.5, value: 1}]}
      - {id: first, after: second, wait: 1}
      - {id: second, after: first, wait: 1}
      - {wait: 1, with: nowhere}
      - {use: motion.spin, target: a}
      - {use: deck.badge, text: hi}
      - {track: p.text, keys: [{at: 0, value: one}]}
      - {track: dot.at, along: a, keys: [{at: 0, value: 0}]}
      - {auto: all}
  children:
    - id: a
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 20
      height: 20
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: dot
      shape: circle
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      radius: 3
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: p
      use: deck.pill
      text: hello
      color: "#2d6cdf"
      ink: "#ffffff"
      size: 18
      width: 0
      radius: 10
    - {use: motion.fade_in, target: a, duration: 0.4, to: 1, ease: out}

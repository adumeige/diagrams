# Timeline errors (spec sections 12 and 13): no item kind, keyframes out of order, a timing loop,
# a sibling that does not exist, an unknown clip, a shape template used as a clip, a clip used as a
# node, a track on a template parameter, `along` on a rectangle, `auto` outside a transition, and
# a camera property that does not exist.
format: diagrams/0.1
viewport: {width: 200, height: 100}
imports:
  motion: ../../../libs/motion.yaml
  deck: ../../../libs/deck.yaml
  paper: ../../../themes/paper.yaml
base_theme: paper
camera: {zoom: 2, focus: a}
scene:
  timeline:
    sequence:
      - {keys: []}
      - track: a.opacity
        keys: [{at: 1, value: 0}, {at: 0.5, value: 1}]
      - {id: first, after: second, wait: 1}
      - {id: second, after: first, wait: 1}
      - {wait: 1, with: nowhere}
      - {use: motion.spin, target: a}
      - {use: deck.badge, text: hi}
      - track: p.text
        keys: [{at: 0, value: one}]
      - track: dot.at
        along: a
        keys: [{at: 0, value: 0}]
      - {auto: all}
  children:
    - {shape: rect, id: a, width: 20, height: 20}
    - {shape: circle, id: dot, radius: 3}
    - {use: deck.pill, id: p, text: hello}
    - {use: motion.fade_in, target: a}

# Template errors (spec section 9): unknown templates, parameters that do not match the schema,
# a slot that does not exist, a missing token, a template cycle, and a path past an interface.
format: diagrams/0.1
viewport: {width: 300, height: 200}
imports:
  lib: ./lib.yaml
scene:
  children:
    - {use: badge}
    - {use: lib.nothing}
    - {use: lib.badge, size: 3, kind: alert, colour: red}
    - {use: lib.ping}
    - use: lib.box
      id: b
      slots: {footer: []}
      children: [{shape: rect, id: mine, width: 5, height: 5}]
    - {shape: connector, from: b.inner, to: b.mine}

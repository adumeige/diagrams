format: diagrams/0.1
viewport: {width: 300, height: 200}
imports: {lib: ./lib.yaml}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - {use: badge}
    - {use: lib.nothing}
    - {use: lib.badge, size: 3, kind: alert, colour: red}
    - {use: lib.ping}
    - id: b
      use: lib.box
      children:
        - id: mine
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 5
          height: 5
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#000000"
          stroke_width: 1
      slots: {footer: []}
    - shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: b.inner
      to: b.mine
      route: layout
      marker_start: none
      marker_end: none
      stroke: "#000000"
      stroke_width: 1

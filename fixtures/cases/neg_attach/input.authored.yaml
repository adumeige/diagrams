# Attachment, connector and layout errors found by the validator.
format: diagrams/0.1
viewport: {width: 200, height: 200}
scene:
  children:
    - id: holder
      children:
        - {shape: rect, id: inner, width: 10, height: 10}
      attach: {to: holder.inner}
    - {shape: rect, id: a, width: 10, height: 10, attach: {to: nowhere}}
    - {shape: rect, id: b, width: 10, height: 10, attach: {to: a.top_left, anchor: middle, policy: stretch, extra: 1}}
    - {shape: rect, id: hidden, width: 10, height: 10, present: false}
    - {shape: rect, id: c, width: 10, height: 10, attach: {to: hidden}}
    - {shape: connector, id: k, from: a, to: a.mid}
    - {shape: connector, id: k2, from: a}
    - {shape: rect, id: f, width: "=a.size", height: "=nobody.height"}
    - {id: g, layout: grid, children: []}

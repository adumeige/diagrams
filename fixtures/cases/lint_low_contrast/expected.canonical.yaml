format: diagrams/0.1
viewport: {width: 360, height: 140}
imports: {paper: ../../../themes/paper.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: faint
      shape: text
      layer: default
      at: {x: 20, y: 16}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: Pale text on the page
      font_size: 16
      fill: "#c8c8c8"
      text_align: start
      wrap: false
    - id: readable
      shape: text
      layer: default
      at: {x: 20, y: 44}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: Ink on the page
      font_size: 16
      fill: {ref: theme.ink}
      text_align: start
      wrap: false
    - id: banner
      layout: free
      layer: default
      at: {x: 20, y: 76}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: bg
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 320
          height: 44
          corner_radius: 0
          fill: "#fdcb6e"
          stroke: "#000000"
          stroke_width: 0
        - id: on_yellow
          shape: text
          layer: default
          at: {x: 12, y: 12}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: White on yellow
          font_size: 16
          fill: "#ffffff"
          text_align: start
          wrap: false
        - id: large
          shape: text
          layer: default
          at: {x: 170, y: 6}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: Large
          font_size: 28
          fill: "#d35400"
          text_align: start
          wrap: false

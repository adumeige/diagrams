# low_contrast: text against the fill behind it, composited over the scene background.
format: diagrams/0.1
viewport: {width: 360, height: 140}
imports:
  paper: ../../../themes/paper.yaml
base_theme: paper
scene:
  children:
    - {shape: text, id: faint, at: {x: 20, y: 16}, text: "Pale text on the page", fill: "#c8c8c8"}
    - {shape: text, id: readable, at: {x: 20, y: 44}, text: "Ink on the page", fill: "=theme.ink"}
    - id: banner
      at: {x: 20, y: 76}
      children:
        - {shape: rect, id: bg, width: 320, height: 44, fill: "#fdcb6e", stroke_width: 0}
        - {shape: text, id: on_yellow, at: {x: 12, y: 12}, text: "White on yellow", fill: "#ffffff"}
        - {shape: text, id: large, at: {x: 170, y: 6}, text: "Large", font_size: 28, fill: "#d35400"}

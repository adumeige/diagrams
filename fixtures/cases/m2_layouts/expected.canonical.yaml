format: diagrams/0.1
viewport: {width: 640, height: 420}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: rows
      layout: column
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      gap: 16
      children:
        - id: start_row
          layout: row
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          gap: 8
          children:
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 40
              height: 20
              corner_radius: 0
              fill: "#74b9ff"
              stroke: "#000000"
              stroke_width: 1
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 40
              height: 50
              corner_radius: 0
              fill: "#0984e3"
              stroke: "#000000"
              stroke_width: 1
            - shape: circle
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              radius: 12
              fill: "#6c5ce7"
              stroke: "#000000"
              stroke_width: 1
        - id: center_row
          layout: row
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          gap: 8
          align: center
          children:
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 40
              height: 20
              corner_radius: 0
              fill: "#74b9ff"
              stroke: "#000000"
              stroke_width: 1
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 40
              height: 50
              corner_radius: 0
              fill: "#0984e3"
              stroke: "#000000"
              stroke_width: 1
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 45
              scale: 1
              opacity: 1
              present: true
              width: 30
              height: 30
              corner_radius: 0
              fill: "#a29bfe"
              stroke: "#000000"
              stroke_width: 1
        - id: stretch_row
          layout: row
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          gap: 8
          padding: 6
          align: stretch
          children:
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 40
              height: 20
              corner_radius: 0
              fill: "#55efc4"
              stroke: "#000000"
              stroke_width: 1
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 40
              height: 50
              corner_radius: 0
              fill: "#00b894"
              stroke: "#000000"
              stroke_width: 1
            - shape: text
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              text: stretch
              font_size: 14
              fill: "#000000"
              text_align: start
              wrap: false
    - id: col
      layout: column
      layer: default
      at: {x: 260, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      gap: 6
      padding: {x: 10, y: 4}
      align: end
      children:
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 120
          height: 24
          corner_radius: 0
          fill: "#fab1a0"
          stroke: "#000000"
          stroke_width: 1
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 60
          height: 24
          corner_radius: 0
          fill: "#e17055"
          stroke: "#000000"
          stroke_width: 1
        - shape: text
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: aligned end
          font_size: 14
          fill: "#000000"
          text_align: start
          wrap: false
    - id: table
      layout: grid
      layer: default
      at: {x: 420, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      gap: 6
      align: center
      columns: 3
      children:
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 50
          height: 30
          corner_radius: 0
          fill: "#ffeaa7"
          stroke: "#000000"
          stroke_width: 1
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 30
          height: 30
          corner_radius: 0
          fill: "#fdcb6e"
          stroke: "#000000"
          stroke_width: 1
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 40
          height: 50
          corner_radius: 0
          fill: "#e1b12c"
          stroke: "#000000"
          stroke_width: 1
        - shape: circle
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 10
          fill: "#fdcb6e"
          stroke: "#000000"
          stroke_width: 1
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 60
          height: 20
          corner_radius: 0
          fill: "#ffeaa7"
          stroke: "#000000"
          stroke_width: 1
    - id: badge
      layout: stack
      layer: default
      at: {x: 260, y: 200}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      align: center
      children:
        - shape: ellipse
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 140
          height: 70
          fill: "#dfe6e9"
          stroke: "#2d3436"
          stroke_width: 1
        - shape: text
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: stacked
          font_size: 18
          fill: "#000000"
          text_align: start
          wrap: false
    - id: frame
      layout: row
      layer: default
      at: {x: 20, y: 260}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 360
      height: 120
      gap: 10
      padding: 10
      align: stretch
      children:
        - shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 80
          height: 10
          corner_radius: 0
          fill: "#81ecec"
          stroke: "#000000"
          stroke_width: 0
        - id: inner
          layout: column
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          gap: 4
          children:
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 100
              height: 20
              corner_radius: 0
              fill: "#00cec9"
              stroke: "#000000"
              stroke_width: 1
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 60
              height: 20
              corner_radius: 0
              fill: "#00cec9"
              stroke: "#000000"
              stroke_width: 1
        - shape: ellipse
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 60
          height: 10
          fill: "#81ecec"
          stroke: "#000000"
          stroke_width: 1

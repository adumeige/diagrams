# Layout containers (spec section 6): row, column, grid and stack, with gap, padding and align.
format: diagrams/0.1
viewport: {width: 640, height: 420}
scene:
  children:
    - id: rows
      at: {x: 20, y: 20}
      layout: column
      gap: 16
      children:
        - id: start_row
          layout: row
          gap: 8
          children:
            - {shape: rect, width: 40, height: 20, fill: "#74b9ff"}
            - {shape: rect, width: 40, height: 50, fill: "#0984e3"}
            - {shape: circle, radius: 12, fill: "#6c5ce7"}
        - id: center_row
          layout: row
          gap: 8
          align: center
          children:
            - {shape: rect, width: 40, height: 20, fill: "#74b9ff"}
            - {shape: rect, width: 40, height: 50, fill: "#0984e3"}
            - {shape: rect, width: 30, height: 30, rotation: 45, fill: "#a29bfe"}
        - id: stretch_row
          layout: row
          gap: 8
          align: stretch
          padding: 6
          children:
            - {shape: rect, width: 40, height: 20, fill: "#55efc4"}
            - {shape: rect, width: 40, height: 50, fill: "#00b894"}
            - {shape: text, text: "stretch", font_size: 14}
    - id: col
      at: {x: 260, y: 20}
      layout: column
      gap: 6
      align: end
      padding: {x: 10, y: 4}
      children:
        - {shape: rect, width: 120, height: 24, fill: "#fab1a0"}
        - {shape: rect, width: 60, height: 24, fill: "#e17055"}
        - {shape: text, text: "aligned end", font_size: 14}
    - id: table
      at: {x: 420, y: 20}
      layout: grid
      columns: 3
      gap: 6
      align: center
      children:
        - {shape: rect, width: 50, height: 30, fill: "#ffeaa7"}
        - {shape: rect, width: 30, height: 30, fill: "#fdcb6e"}
        - {shape: rect, width: 40, height: 50, fill: "#e1b12c"}
        - {shape: circle, radius: 10, fill: "#fdcb6e"}
        - {shape: rect, width: 60, height: 20, fill: "#ffeaa7"}
    - id: badge
      at: {x: 260, y: 200}
      layout: stack
      align: center
      children:
        - {shape: ellipse, width: 140, height: 70, fill: "#dfe6e9", stroke: "#2d3436"}
        - {shape: text, text: "stacked", font_size: 18}
    - id: frame
      at: {x: 20, y: 260}
      layout: row
      width: 360
      height: 120
      padding: 10
      gap: 10
      align: stretch
      children:
        - {shape: rect, width: 80, height: 10, fill: "#81ecec", stroke_width: 0}
        - id: inner
          layout: column
          gap: 4
          children:
            - {shape: rect, width: 100, height: 20, fill: "#00cec9"}
            - {shape: rect, width: 60, height: 20, fill: "#00cec9"}
        - {shape: ellipse, width: 60, height: 10, fill: "#81ecec"}

# The camera (spec section 14): fit with padding into a region of the viewport, a state container
# on the camera, a screen-space layer that ignores it and a parallax layer that follows it in part.
format: diagrams/0.1
viewport: {width: 480, height: 270}
imports:
  paper: ../../../themes/paper.yaml
base_theme: paper
camera:
  fit: stage.a
  padding: 16
  into: {x: 0, y: 40, width: 480, height: 230}
  states:
    defaults: {duration: 1, ease: in_out}
    sequence:
      - id: close
      - {id: wide, set: {fit: stage}}
scene:
  layers: [{name: back, parallax: 0.3}, default, {name: hud, space: screen}]
  children:
    - {shape: rect, id: band, layer: back, at: {x: 0, y: 120}, width: 480, height: 40, fill: "#e6eaed", stroke_width: 0}
    - id: stage
      children:
        - {shape: rect, id: a, at: {x: 40, y: 80}, width: 100, height: 60, fill: "=theme.accent", stroke_width: 0}
        - {shape: rect, id: b, at: {x: 320, y: 160}, width: 100, height: 60, fill: "#636e72", stroke_width: 0}
        - {shape: connector, from: a, to: b, route: orthogonal, stroke: "#2d3436", stroke_width: 2, marker_end: arrow}
    - {shape: text, id: title, layer: hud, at: {x: 16, y: 10}, text: Camera, font_size: 18, fill: "#2d3436"}

format: diagrams/0.1
viewport: {width: 480, height: 270}
imports: {paper: ../../../themes/paper.yaml}
base_theme: paper
camera:
  fit: stage.a
  padding: 16
  into: {x: 0, y: 40, width: 480, height: 230}
  states:
    defaults: {duration: 1, ease: in_out}
    cumulative: false
    sequence: [{id: close}, {id: wide, set: {fit: stage}}]
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  layers: [{name: back, parallax: 0.3}, default, {name: hud, space: screen}]
  children:
    - id: band
      shape: rect
      layer: back
      at: {x: 0, y: 120}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 480
      height: 40
      corner_radius: 0
      fill: "#e6eaed"
      stroke: "#000000"
      stroke_width: 0
    - id: stage
      layout: free
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: a
          shape: rect
          layer: default
          at: {x: 40, y: 80}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 100
          height: 60
          corner_radius: 0
          fill: {ref: theme.accent}
          stroke: "#000000"
          stroke_width: 0
        - id: b
          shape: rect
          layer: default
          at: {x: 320, y: 160}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 100
          height: 60
          corner_radius: 0
          fill: "#636e72"
          stroke: "#000000"
          stroke_width: 0
        - shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          from: a
          to: b
          route: orthogonal
          marker_start: none
          marker_end: arrow
          stroke: "#2d3436"
          stroke_width: 2
    - id: title
      shape: text
      layer: hud
      at: {x: 16, y: 10}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: Camera
      font_size: 18
      fill: "#2d3436"
      text_align: start
      wrap: false

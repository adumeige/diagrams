# Dashed strokes (spec section 10, stroke_dash): every stroked primitive, a connector whose markers
# stay solid, an odd-length pattern, a dashed style, and a solid stroke for comparison.
format: diagrams/0.1
title: Dashed strokes
viewport: {width: 640, height: 320}
styles:
  dashed: {stroke: "#2d3436", stroke_width: 2, stroke_dash: [8, 5]}
scene:
  children:
    - {shape: rect, id: solid, at: {x: 40, y: 40}, width: 120, height: 70, fill: "#ffffff", stroke: "#2d3436", stroke_width: 2}
    - {shape: rect, id: box, at: {x: 220, y: 40}, width: 120, height: 70, corner_radius: 10, fill: "#dfe6e9", style: dashed}
    - {shape: ellipse, id: oval, at: {x: 400, y: 40}, width: 160, height: 70, fill: "#ffeaa7", stroke: "#d63031", stroke_width: 2, stroke_dash: [2, 4]}
    - shape: polyline
      id: zigzag
      at: {x: 40, y: 160}
      points: [{x: 0, y: 40}, {x: 40, y: 0}, {x: 80, y: 40}, {x: 120, y: 0}]
      stroke: "#0984e3"
      stroke_width: 3
      stroke_dash: [10, 4, 2]
    - shape: path
      id: wave
      at: {x: 220, y: 160}
      d: "M0 20 C 30 -10, 60 50, 120 20"
      stroke: "#00b894"
      stroke_width: 2
      stroke_dash: [6, 3]
    - {shape: connector, id: link, from: solid, to: box, marker_end: triangle, stroke: "#2d3436", stroke_width: 1.5, stroke_dash: [6, 4]}
    - {shape: connector, id: back, from: box.south, to: oval.south_west, route: orthogonal, marker_end: open_arrow, marker_start: diamond, stroke: "#6c5ce7", stroke_width: 1.5, stroke_dash: [4, 4]}

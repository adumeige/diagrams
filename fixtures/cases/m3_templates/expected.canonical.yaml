format: diagrams/0.1
viewport: {width: 760, height: 420}
imports: {uml: ../../../libs/uml.yaml, paper: ../../../themes/paper.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  layers: [edges, default]
  children:
    - id: team
      use: uml.class
      at: {x: 40, y: 40}
      name: Team
      stereotype: ""
      abstract: false
      attributes: [{name: String}, {country: String}]
      operations: [{squad: "(): Player[]"}]
      static: []
    - id: player
      use: uml.class
      at: {x: 440, y: 40}
      name: Player
      stereotype: entity
      abstract: false
      attributes: [{name: String}, {position: Position}, {caps: Int}]
      operations: []
      static: []
    - id: person
      use: uml.class
      at: {x: 460, y: 300}
      name: Person
      stereotype: ""
      abstract: true
      attributes: []
      operations: []
      static: []
    - id: lineup
      use: uml.aggregation
      layer: edges
      from: team
      to: player
      label: lineup
      from_mult: "1"
      to_mult: "23"
      from_role: ""
      to_role: ""
      route: orthogonal
      label_side: above
      label_gap: 4
    - use: uml.generalization
      layer: edges
      from: player
      to: person
      label: ""
      from_mult: ""
      to_mult: ""
      from_role: ""
      to_role: ""
      route: orthogonal
      label_side: above
      label_gap: 4
    - id: squad_note
      use: uml.note
      attach: {anchor: north, to: lineup.line.mid, gap: -110}
      text: "Matchday squad: 15 starters and 8 replacements"
      width: 180
    - shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: squad_note
      to: team.attribute_list
      route: layout
      marker_start: none
      marker_end: arrow
      stroke: "#636e72"
      stroke_width: 1

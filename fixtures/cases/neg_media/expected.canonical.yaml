format: diagrams/0.1
viewport: {width: 300, height: 160}
assets:
  photo: {kind: image, file: ../../../media/diagram.png}
  voice: {kind: audio, file: ../../../media/narration.wav}
  model: {kind: mesh, file: model.glb}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: empty
      media: image
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      fit: contain
    - id: missing
      media: image
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: logo
      fit: contain
    - id: wrong
      media: video
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: photo
      width: 40
      fit: contain
      start: 0
      in: 0
      volume: 1
      rate: 1
    - id: voice_node
      media: audio
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: voice
      start: 0
      in: 0
      volume: -1
      rate: 1
    - {media: hologram, id: odd}

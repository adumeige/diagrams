# Media errors (spec section 15): an asset kind that does not exist, a media node without an asset,
# an asset that no `assets` map declares, an asset of the wrong kind, a negative volume, and an
# unknown media kind.
format: diagrams/0.1
viewport: {width: 300, height: 160}
assets:
  photo: {kind: image, file: ../../../media/diagram.png}
  voice: {kind: audio, file: ../../../media/narration.wav}
  model: {kind: mesh, file: model.glb}
scene:
  children:
    - {media: image, id: empty}
    - {media: image, id: missing, asset: logo}
    - {media: video, id: wrong, asset: photo, width: 40}
    - {media: audio, id: voice_node, asset: voice, volume: -1}
    - {media: hologram, id: odd}

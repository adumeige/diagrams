# The circular and force layouts (graph layouts addendum, sections 6 and 7). Neither supplies
# routes: the connectors are straight. Circular: declaration order on a ring, `radius` and
# `start_angle`. Force: the same document always gives the same picture; `seed` gives another one,
# `link_distance` scales it, and a `pinned` node stays where the author put it.
format: diagrams/0.1
viewport: {width: 1000, height: 560}
styles:
  dot: {fill: "#ffeaa7", stroke: "#2d3436", stroke_width: 1.5}
  hub: {fill: "#fab1a0", stroke: "#2d3436", stroke_width: 1.5}
  edge: {stroke: "#2d3436", stroke_width: 1.5}
scene:
  children:
    - id: ring
      at: {x: 20, y: 20}
      layout: circular
      children:
        - {shape: circle, id: n1, radius: 20, style: hub}
        - {shape: circle, id: n2, radius: 20, style: dot}
        - {shape: circle, id: n3, radius: 20, style: dot}
        - {shape: circle, id: n4, radius: 20, style: dot}
        - {shape: circle, id: n5, radius: 20, style: dot}
        - {shape: circle, id: n6, radius: 20, style: dot}
        - {shape: circle, id: n7, radius: 20, style: dot}
        - {shape: connector, from: n1, to: n2, style: edge}
        - {shape: connector, from: n2, to: n3, style: edge}
        - {shape: connector, from: n3, to: n4, style: edge}
        - {shape: connector, from: n4, to: n5, style: edge}
        - {shape: connector, from: n5, to: n6, style: edge}
        - {shape: connector, from: n6, to: n7, style: edge}
        - {shape: connector, from: n7, to: n1, style: edge}
        - {shape: connector, from: n1, to: n4, style: edge}
        - {shape: connector, from: n2, to: n6, style: edge}
    - id: wide
      at: {x: 20, y: 280}
      layout: circular
      radius: 100
      start_angle: 180
      children:
        - {shape: rect, id: first, width: 50, height: 30, style: hub}
        - {shape: rect, id: second, width: 50, height: 30, style: dot}
        - {shape: rect, id: third, width: 50, height: 30, style: dot}
        - {shape: rect, id: fourth, width: 50, height: 30, style: dot}
        - {shape: connector, from: first, to: third, style: edge}
        - {shape: connector, from: second, to: fourth, style: edge}
    - id: net
      at: {x: 320, y: 20}
      layout: force
      children:
        - {shape: circle, id: core, radius: 24, style: hub}
        - {shape: circle, id: p1, radius: 14, style: dot}
        - {shape: circle, id: p2, radius: 14, style: dot}
        - {shape: circle, id: p3, radius: 14, style: dot}
        - {shape: circle, id: p4, radius: 14, style: dot}
        - {shape: circle, id: q1, radius: 10, style: dot}
        - {shape: circle, id: q2, radius: 10, style: dot}
        - {shape: circle, id: other, radius: 24, style: hub}
        - {shape: circle, id: r1, radius: 14, style: dot}
        - {shape: circle, id: r2, radius: 14, style: dot}
        - {shape: connector, from: core, to: p1, style: edge}
        - {shape: connector, from: core, to: p2, style: edge}
        - {shape: connector, from: core, to: p3, style: edge}
        - {shape: connector, from: core, to: p4, style: edge}
        - {shape: connector, from: p1, to: q1, style: edge}
        - {shape: connector, from: p1, to: q2, style: edge}
        - {shape: connector, from: core, to: other, style: edge}
        - {shape: connector, from: other, to: r1, style: edge}
        - {shape: connector, from: other, to: r2, style: edge}
        - {shape: connector, from: r1, to: r2, style: edge}
    - id: held
      at: {x: 660, y: 20}
      width: 320
      height: 500
      layout: force
      seed: 7
      link_distance: 40
      children:
        - {shape: circle, id: upper, radius: 18, style: hub, pinned: {x: 140, y: 20}}
        - {shape: circle, id: lower, radius: 18, style: hub, pinned: {x: 140, y: 440}}
        - {shape: circle, id: m1, radius: 12, style: dot}
        - {shape: circle, id: m2, radius: 12, style: dot}
        - {shape: circle, id: m3, radius: 12, style: dot}
        - {shape: circle, id: m4, radius: 12, style: dot}
        - {shape: connector, from: upper, to: m1, style: edge}
        - {shape: connector, from: upper, to: m2, style: edge}
        - {shape: connector, from: m1, to: m3, style: edge}
        - {shape: connector, from: m2, to: m4, style: edge}
        - {shape: connector, from: m3, to: lower, style: edge}
        - {shape: connector, from: m4, to: lower, style: edge}
        - {shape: connector, from: m1, to: m2, style: edge}

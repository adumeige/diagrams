# Every primitive, nested free containers, rotation, scale and opacity.
format: diagrams/0.1
title: Primitives
viewport: {width: 640, height: 420}
scene:
  children:
    - shape: rect
      id: background
      width: "=viewport.width"
      height: "=viewport.height"
      fill: "#fbfaf7"
      stroke: "#00000000"
    - id: shapes
      at: {x: 40, y: 40}
      children:
        - {shape: rect, id: square, width: 80, height: 80, fill: "#74b9ff"}
        - {shape: rect, id: tilted, at: {x: 120, y: 0}, width: 80, height: 80, rotation: 30, fill: "#a29bfe"}
        - {shape: ellipse, id: oval, at: {x: 240, y: 10}, width: 120, height: 60, fill: "#55efc4"}
        - {shape: circle, id: faded, at: {x: 400, y: 0}, radius: 40, fill: "#fd79a8", opacity: 0.5}
        - shape: line
          id: rule
          at: {x: 0, y: 120}
          points: [{x: 0, y: 0}, {x: 560, y: 0}]
          stroke: "#636e72"
          stroke_width: 2
        - shape: polyline
          id: zigzag
          at: {x: 0, y: 150}
          points: [{x: 0, y: 40}, {x: 40, y: 0}, {x: 80, y: 40}, {x: 120, y: 0}, {x: 160, y: 40}]
          stroke: "#d63031"
          stroke_width: 3
        - shape: polygon
          id: triangle
          at: {x: 200, y: 150}
          points: [{x: 40, y: 0}, {x: 80, y: 60}, {x: 0, y: 60}]
          fill: "#ffeaa7"
        - shape: path
          id: wave
          at: {x: 320, y: 150}
          d: "M0 30 C 30 -10, 60 70, 90 30 S 150 -10, 180 30 L 180 60 H 0 Z"
          fill: "#81ecec"
          stroke: "#00b894"
        - id: badge
          at: {x: 0, y: 250}
          scale: 1.5
          children:
            - {shape: rect, width: 120, height: 40, corner_radius: 20, fill: "#2d3436"}
            - shape: text
              at: {x: 0, y: 8}
              width: 120
              text: Scaled
              text_align: center
              fill: "#ffffff"
        - shape: text
          id: note
          at: {x: 240, y: 250}
          width: 300
          text: "Two lines of text,\naligned to the end"
          text_align: end
          font_size: 20
          fill: "#2d3436"

format: diagrams/0.1
title: Primitives
viewport: {width: 640, height: 420}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: background
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: {ref: viewport.width}
      height: {ref: viewport.height}
      corner_radius: 0
      fill: "#fbfaf7"
      stroke: "#00000000"
      stroke_width: 1
    - id: shapes
      layout: free
      layer: default
      at: {x: 40, y: 40}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: square
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 80
          height: 80
          corner_radius: 0
          fill: "#74b9ff"
          stroke: "#000000"
          stroke_width: 1
        - id: tilted
          shape: rect
          layer: default
          at: {x: 120, y: 0}
          rotation: 30
          scale: 1
          opacity: 1
          present: true
          width: 80
          height: 80
          corner_radius: 0
          fill: "#a29bfe"
          stroke: "#000000"
          stroke_width: 1
        - id: oval
          shape: ellipse
          layer: default
          at: {x: 240, y: 10}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 120
          height: 60
          fill: "#55efc4"
          stroke: "#000000"
          stroke_width: 1
        - id: faded
          shape: circle
          layer: default
          at: {x: 400, y: 0}
          rotation: 0
          scale: 1
          opacity: 0.5
          present: true
          radius: 40
          fill: "#fd79a8"
          stroke: "#000000"
          stroke_width: 1
        - id: rule
          shape: line
          layer: default
          at: {x: 0, y: 120}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          points: [{x: 0, y: 0}, {x: 560, y: 0}]
          stroke: "#636e72"
          stroke_width: 2
        - id: zigzag
          shape: polyline
          layer: default
          at: {x: 0, y: 150}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          points: [{x: 0, y: 40}, {x: 40, y: 0}, {x: 80, y: 40}, {x: 120, y: 0}, {x: 160, y: 40}]
          stroke: "#d63031"
          stroke_width: 3
        - id: triangle
          shape: polygon
          layer: default
          at: {x: 200, y: 150}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          points: [{x: 40, y: 0}, {x: 80, y: 60}, {x: 0, y: 60}]
          fill: "#ffeaa7"
          stroke: "#000000"
          stroke_width: 1
        - id: wave
          shape: path
          layer: default
          at: {x: 320, y: 150}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          d: "M0 30 C 30 -10, 60 70, 90 30 S 150 -10, 180 30 L 180 60 H 0 Z"
          fill: "#81ecec"
          stroke: "#00b894"
          stroke_width: 1
        - id: badge
          layout: free
          layer: default
          at: {x: 0, y: 250}
          rotation: 0
          scale: 1.5
          opacity: 1
          present: true
          children:
            - shape: rect
              layer: default
              at: {x: 0, y: 0}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              width: 120
              height: 40
              corner_radius: 20
              fill: "#2d3436"
              stroke: "#000000"
              stroke_width: 1
            - shape: text
              layer: default
              at: {x: 0, y: 8}
              rotation: 0
              scale: 1
              opacity: 1
              present: true
              text: Scaled
              font_size: 16
              fill: "#ffffff"
              text_align: center
              width: 120
              wrap: false
        - id: note
          shape: text
          layer: default
          at: {x: 240, y: 250}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: "Two lines of text,\naligned to the end"
          font_size: 20
          fill: "#2d3436"
          text_align: end
          width: 300
          wrap: false

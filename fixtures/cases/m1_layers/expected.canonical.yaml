format: diagrams/0.1
viewport: {width: 300, height: 200}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  layers: [back, default, front]
  children:
    - id: upper
      shape: rect
      layer: front
      at: {x: 100, y: 60}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 120
      height: 80
      corner_radius: 0
      fill: "#e17055"
      stroke: "#000000"
      stroke_width: 1
    - id: middle
      shape: rect
      layer: default
      at: {x: 70, y: 40}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 120
      height: 80
      corner_radius: 0
      fill: "#fdcb6e"
      stroke: "#000000"
      stroke_width: 1
    - id: lower
      shape: rect
      layer: back
      at: {x: 40, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 120
      height: 80
      corner_radius: 0
      fill: "#0984e3"
      stroke: "#000000"
      stroke_width: 1
    - id: group
      layout: free
      layer: front
      at: {x: 180, y: 110}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      layers: [over, under]
      children:
        - id: a
          shape: circle
          layer: under
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 30
          fill: "#6c5ce7"
          stroke: "#000000"
          stroke_width: 1
        - id: b
          shape: circle
          layer: default
          at: {x: 20, y: 20}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 20
          fill: "#00cec9"
          stroke: "#000000"
          stroke_width: 1

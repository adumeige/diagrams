# Paint order: named layers, then declaration order (spec section 8).
format: diagrams/0.1
viewport: {width: 300, height: 200}
scene:
  layers: [back, default, front]
  children:
    - {shape: rect, id: upper, layer: front, at: {x: 100, y: 60}, width: 120, height: 80, fill: "#e17055"}
    - {shape: rect, id: middle, at: {x: 70, y: 40}, width: 120, height: 80, fill: "#fdcb6e"}
    - {shape: rect, id: lower, layer: back, at: {x: 40, y: 20}, width: 120, height: 80, fill: "#0984e3"}
    - id: group
      layer: front
      layers: [over, under]
      at: {x: 180, y: 110}
      children:
        - {shape: circle, id: a, layer: under, radius: 30, fill: "#6c5ce7"}
        - {shape: circle, id: b, at: {x: 20, y: 20}, radius: 20, fill: "#00cec9"}

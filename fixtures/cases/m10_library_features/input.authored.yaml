# Library features of the core (spec section 9): a template that extends another with fixed
# parameters, choose() for a marker and a style, count() for equal shares, a slot under a named part
# (its children are addressed through the instance), a polygon outline that a diagonal connector
# stops on, and a minimum size.
format: diagrams/0.1
viewport: {width: 560, height: 360}
imports: {lib: lib.yaml}
scene:
  children:
    - use: lib.shelf
      id: store
      at: {x: 30, y: 30}
      cells: [a: One, b: Two, c: Three]
      children:
        - {shape: circle, id: dot, radius: 12, fill: "#74b9ff"}
    - {use: lib.diamond, id: gate, at: {x: 400, y: 200}}
    - {id: pad, at: {x: 30, y: 220}, layout: column, min_width: 120, min_height: 60, children: [{shape: text, text: tiny}]}
    - {shape: rect, at: {x: 30, y: 220}, width: "=pad.width", height: "=pad.height", fill: "#00000000", stroke: "#b2bec3"}
    - {use: lib.edge, from: store.dot, to: gate}
    - {use: lib.hint, from: "store.cell[c]", to: gate}

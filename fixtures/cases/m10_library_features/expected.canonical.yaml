format: diagrams/0.1
viewport: {width: 560, height: 360}
imports: {lib: lib.yaml}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: store
      use: lib.shelf
      at: {x: 30, y: 30}
      cells: [{a: One}, {b: Two}, {c: Three}]
      width: 240
      children:
        - id: dot
          shape: circle
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 12
          fill: "#74b9ff"
          stroke: "#000000"
          stroke_width: 1
    - {id: gate, use: lib.diamond, at: {x: 400, y: 200}}
    - id: pad
      layout: column
      layer: default
      at: {x: 30, y: 220}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      min_width: 120
      min_height: 60
      children:
        - shape: text
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: tiny
          font_size: 16
          fill: "#000000"
          text_align: start
          wrap: false
    - shape: rect
      layer: default
      at: {x: 30, y: 220}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: {ref: pad.width}
      height: {ref: pad.height}
      corner_radius: 0
      fill: "#00000000"
      stroke: "#b2bec3"
      stroke_width: 1
    - {use: lib.edge, from: store.dot, to: gate, dashed: false, open: false}
    - {use: lib.hint, from: "store.cell[c]", to: gate}

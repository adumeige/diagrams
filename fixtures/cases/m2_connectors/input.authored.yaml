# Connectors and routing (spec section 7): floating and fixed ends, straight and orthogonal
# routers, a connector ending on another connector, and a label attached to a midpoint.
format: diagrams/0.1
viewport: {width: 640, height: 400}
scene:
  layers: [edges, default, labels]
  children:
    - {shape: rect, id: a, at: {x: 40, y: 40}, width: 120, height: 60, fill: "#dfe6e9", stroke: "#2d3436"}
    - {shape: circle, id: b, at: {x: 300, y: 150}, radius: 40, fill: "#ffeaa7", stroke: "#2d3436"}
    - {shape: rect, id: c, at: {x: 480, y: 40}, width: 120, height: 60, fill: "#dfe6e9", stroke: "#2d3436"}
    - id: group
      at: {x: 40, y: 260}
      children:
        - {shape: rect, id: dd, width: 120, height: 60, fill: "#dfe6e9", stroke: "#2d3436"}
    - {shape: rect, id: e, at: {x: 480, y: 280}, width: 120, height: 60, fill: "#dfe6e9", stroke: "#2d3436"}
    - {shape: connector, id: ab, layer: edges, from: a, to: b, stroke: "#2d3436", stroke_width: 2}
    - {shape: connector, id: bc, layer: edges, from: b, to: c.west, stroke: "#2d3436", stroke_width: 2}
    - {shape: connector, id: ac, layer: edges, from: a.north, to: c.north, route: orthogonal, stroke: "#0984e3", stroke_width: 2}
    - {shape: connector, id: de, layer: edges, from: group.dd, to: e, route: orthogonal, stroke: "#00b894", stroke_width: 2}
    - {shape: connector, id: ad, layer: edges, from: a, to: group.dd, route: orthogonal, stroke: "#e17055", stroke_width: 2}
    - {shape: connector, id: rel, layer: edges, from: b.south, to: de.mid, stroke: "#6c5ce7", stroke_width: 1}
    - {shape: text, id: label, layer: labels, text: "mid", font_size: 12, attach: {anchor: south, to: ab.mid, gap: 4}}

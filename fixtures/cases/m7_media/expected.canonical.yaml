format: diagrams/0.1
viewport: {width: 520, height: 260}
imports: {motion: ../../../libs/motion.yaml, paper: ../../../themes/paper.yaml}
base_theme: paper
assets:
  photo: {kind: image, file: ../../../media/diagram.png}
  narration: {kind: audio, file: ../../../media/narration.wav}
  clip: {kind: video, file: ../../../media/clip.mp4}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  timeline:
    parallel:
      - {use: motion.fade_in, target: photo, at: "narration.cue[engine]", duration: 0.5}
      - {use: motion.pulse, target: badge, with: narration, amount: 1.2}
  children:
    - id: photo
      media: image
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: photo
      width: 200
      fit: contain
    - id: cropped
      media: image
      layer: default
      at: {x: 240, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: photo
      width: 90
      height: 90
      fit: cover
    - id: movie
      media: video
      layer: default
      at: {x: 340, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: clip
      width: 160
      fit: contain
      start: 1
      in: 0
      volume: 1
      rate: 1
    - id: narration
      media: audio
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      asset: narration
      start: 0.5
      in: 0
      volume: 1
      rate: 1
    - id: badge
      shape: rect
      layer: default
      at: {x: 240, y: 160}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 80
      height: 40
      corner_radius: 0
      fill: {ref: theme.accent}
      stroke: "#000000"
      stroke_width: 0

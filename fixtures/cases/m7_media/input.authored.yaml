# Media (spec section 15): an image at its intrinsic aspect ratio and one cropped with `fit: cover`,
# a video (drawn as a placeholder by renderers without a decoder), and an audio node whose cue
# points and duration drive the timeline: a fade starts at a cue, a pulse lasts as long as the audio.
format: diagrams/0.1
viewport: {width: 520, height: 260}
imports:
  motion: ../../../libs/motion.yaml
  paper: ../../../themes/paper.yaml
base_theme: paper
assets:
  photo: {kind: image, file: ../../../media/diagram.png}
  narration: {kind: audio, file: ../../../media/narration.wav}
  clip: {kind: video, file: ../../../media/clip.mp4}
scene:
  timeline:
    parallel:
      - {use: motion.fade_in, target: photo, at: "narration.cue[engine]", duration: 0.5}
      - {use: motion.pulse, target: badge, with: narration, amount: 1.2}
  children:
    - {media: image, id: photo, asset: photo, width: 200, at: {x: 20, y: 20}}
    - {media: image, id: cropped, asset: photo, width: 90, height: 90, fit: cover, at: {x: 240, y: 20}}
    - {media: video, id: movie, asset: clip, width: 160, at: {x: 340, y: 20}, start: 1}
    - {media: audio, id: narration, asset: narration, start: 0.5}
    - {shape: rect, id: badge, at: {x: 240, y: 160}, width: 80, height: 40, fill: "=theme.accent", stroke_width: 0}

format: diagrams/0.1
title: Theme tokens
viewport: {width: 480, height: 300}
imports: {paper: ../../../themes/paper.yaml, dark: ../../../themes/dark.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: heading
      shape: text
      layer: default
      at: {x: 24, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: Tokens and fonts
      font_size: 28
      fill: {ref: theme.ink}
      text_align: start
      wrap: false
    - id: light
      layout: free
      layer: default
      at: {x: 24, y: 80}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: box
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 200
          height: 120
          corner_radius: {ref: theme.radius}
          fill: {ref: theme.surface}
          stroke: {ref: theme.stroke}
          stroke_width: {ref: theme.stroke_width}
        - id: dot
          shape: circle
          layer: default
          at: {x: 16, y: 16}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 10
          fill: {ref: theme.primary}
          stroke: "#000000"
          stroke_width: 0
        - id: label
          shape: text
          layer: default
          at: {x: 16, y: 48}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: "Base theme\nsecond line"
          font_size: 16
          fill: {ref: theme.ink}
          text_align: center
          width: 168
          wrap: false
    - id: dark_card
      layout: free
      layer: default
      at: {x: 256, y: 80}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      theme: dark
      children:
        - id: box
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 200
          height: 120
          corner_radius: {ref: theme.radius}
          fill: {ref: theme.surface}
          stroke: {ref: theme.stroke}
          stroke_width: {ref: theme.stroke_width}
        - id: dot
          shape: circle
          layer: default
          at: {x: 16, y: 16}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 10
          fill: {ref: theme.primary}
          stroke: "#000000"
          stroke_width: 0
        - id: label
          shape: text
          layer: default
          at: {x: 16, y: 48}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: "theme: dark"
          font_size: 16
          fill: {ref: theme.ink}
          text_align: center
          width: 168
          wrap: false
    - id: override
      layout: free
      layer: default
      at: {x: 24, y: 220}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      theme: {primary: {ref: theme.accent}, stroke_width: 4}
      children:
        - id: bar
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 432
          height: 40
          corner_radius: 20
          fill: {ref: theme.primary}
          stroke: {ref: theme.stroke}
          stroke_width: {ref: theme.stroke_width}
        - id: note
          shape: text
          layer: default
          at: {x: 20, y: 5}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: "Overridden primary, stroke 4"
          font_size: 24
          fill: "#ffffff"
          text_align: start
          wrap: false

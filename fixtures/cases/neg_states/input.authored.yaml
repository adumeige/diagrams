# State errors (spec sections 11 and 18): unknown paths and properties, an extends cycle, a state
# that does not exist, a bad easing, two kinds in one container, and a state set past an interface.
format: diagrams/0.1
viewport: {width: 300, height: 200}
imports:
  deck: ../../../libs/deck.yaml
scene:
  states:
    defaults: {duration: 0.5, ease: bounce}
    sequence:
      - {id: s1, set: {nothing.present: true, a.colour: "#ff0000", a: true}}
      - {id: s2, extends: s3}
      - {id: s3, extends: s2, set: {box.state: shut, a.present: "yes"}}
      - {id: s4, extends: s9, set: {badge.radius: 30}}
    transitions:
      - {from: s1, to: s7, duration: 1}
  children:
    - {shape: rect, id: a, width: 10, height: 10}
    - id: box
      state: missing
      states: {bag: [{id: open}], sequence: [{id: x}]}
    - {use: deck.badge, id: badge, label: "1"}
    - id: c
      states: {bag: [{id: lit, set: {badge.label: "2", "list.item[1].present": false}}]}
    - {use: deck.bullets, id: list, items: [first, second]}

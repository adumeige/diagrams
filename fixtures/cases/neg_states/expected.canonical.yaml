format: diagrams/0.1
viewport: {width: 300, height: 200}
imports: {deck: ../../../libs/deck.yaml}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  states:
    defaults: {duration: 0.5, ease: bounce}
    cumulative: false
    sequence:
      - {id: s1, set: {nothing.present: true, a.colour: "#ff0000", a: true}}
      - {id: s2, extends: s3}
      - {id: s3, extends: s2, set: {box.state: shut, a.present: "yes"}}
      - {id: s4, extends: s9, set: {badge.radius: 30}}
    transitions: [{from: s1, to: s7, duration: 1}]
  children:
    - id: a
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 10
      height: 10
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: box
      layout: free
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      state: missing
      states:
        defaults: {duration: 0.5, ease: in_out}
        cumulative: false
        bag: [{id: open}]
        sequence: [{id: x}]
      children: []
    - {id: badge, use: deck.badge, label: "1", radius: 22, color: "#2d6cdf"}
    - id: c
      layout: free
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      states:
        defaults: {duration: 0.5, ease: in_out}
        bag: [{id: lit, set: {badge.label: "2", "list.item[1].present": false}}]
      children: []
    - id: list
      use: deck.bullets
      items: [first, second]
      size: 26
      width: 760
      shown: 1000

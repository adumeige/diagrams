# Time (spec section 12): a looping root timeline with containers, relative timing (after, with),
# a stagger, clips from the motion library, raw tracks, a color track, a path track along a
# connector, and two tracks on one property (blended, with the warning blend_overlap).
format: diagrams/0.1
viewport: {width: 480, height: 260}
imports:
  motion: ../../../libs/motion.yaml
  paper: ../../../themes/paper.yaml
base_theme: paper
scene:
  timeline:
    loop: true
    parallel:
      - sequence:
          - id: build
            stagger:
              - {use: motion.fade_in, target: a, duration: 0.5}
              - {use: motion.fade_in, target: b, duration: 0.5}
            interval: 0.25
          - {use: motion.draw_stroke, target: link, duration: 0.5}
          - {use: motion.travel, target: dot, along: link, duration: 1, id: go}
          - {use: motion.pulse, target: b, with: go, amount: 1.3}
          - {wait: 0.5}
      - track: a.fill
        at: 1
        keys:
          - {at: 0, value: "#b2bec3"}
          - {at: 0.5, value: "=theme.accent"}
      - track: a.at.x
        keys: [{at: 0, value: 40}, {at: 2, value: 80}]
      - track: a.at.x
        keys: [{at: 1, value: 40}, {at: 2, value: 60}]
  children:
    - {shape: rect, id: a, at: {x: 40, y: 100}, width: 90, height: 60, fill: "#b2bec3", stroke_width: 0}
    - {shape: rect, id: b, at: {x: 340, y: 60}, width: 90, height: 60, fill: "#b2bec3", stroke_width: 0}
    - {shape: connector, id: link, from: a, to: b, stroke: "#636e72", stroke_width: 2, marker_end: arrow}
    - {shape: circle, id: dot, radius: 7, fill: "=theme.accent", stroke_width: 0}

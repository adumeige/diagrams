format: diagrams/0.1
viewport: {width: 480, height: 260}
imports: {motion: ../../../libs/motion.yaml, paper: ../../../themes/paper.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  timeline:
    loop: true
    parallel:
      - sequence:
          - id: build
            stagger:
              - {use: motion.fade_in, target: a, duration: 0.5}
              - {use: motion.fade_in, target: b, duration: 0.5}
            interval: 0.25
          - {use: motion.draw_stroke, target: link, duration: 0.5}
          - {use: motion.travel, target: dot, along: link, duration: 1, id: go}
          - {use: motion.pulse, target: b, with: go, amount: 1.3}
          - {wait: 0.5}
      - track: a.fill
        at: 1
        keys: [{at: 0, value: "#b2bec3"}, {at: 0.5, value: {ref: theme.accent}}]
      - {track: a.at.x, keys: [{at: 0, value: 40}, {at: 2, value: 80}]}
      - {track: a.at.x, keys: [{at: 1, value: 40}, {at: 2, value: 60}]}
  children:
    - id: a
      shape: rect
      layer: default
      at: {x: 40, y: 100}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 90
      height: 60
      corner_radius: 0
      fill: "#b2bec3"
      stroke: "#000000"
      stroke_width: 0
    - id: b
      shape: rect
      layer: default
      at: {x: 340, y: 60}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 90
      height: 60
      corner_radius: 0
      fill: "#b2bec3"
      stroke: "#000000"
      stroke_width: 0
    - id: link
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: a
      to: b
      route: straight
      marker_start: none
      marker_end: arrow
      stroke: "#636e72"
      stroke_width: 2
    - id: dot
      shape: circle
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      radius: 7
      fill: {ref: theme.accent}
      stroke: "#000000"
      stroke_width: 0

# text_overflow and connector_crosses_shape.
format: diagrams/0.1
viewport: {width: 420, height: 200}
scene:
  children:
    - {shape: text, id: tight, at: {x: 20, y: 20}, width: 60, text: "This line is too long", font_size: 14}
    - id: card
      at: {x: 20, y: 60}
      children:
        - {shape: rect, id: bg, width: 90, height: 40, fill: "#dfe6e9"}
        - {shape: text, id: label, at: {x: 10, y: 10}, text: "Overflowing label", font_size: 14}
    - {shape: rect, id: west_box, at: {x: 20, y: 140}, width: 60, height: 40, fill: "#ffeaa7"}
    - {shape: rect, id: blocker, at: {x: 180, y: 130}, width: 50, height: 60, fill: "#fab1a0"}
    - {shape: rect, id: east_box, at: {x: 340, y: 140}, width: 60, height: 40, fill: "#ffeaa7"}
    - {shape: connector, id: through, from: west_box, to: east_box}

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g data-path="scene">
    <g data-path="tight" transform="translate(20 20)" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#000000">
      <text x="0" y="11.977" xml:space="preserve">This line is too long</text>
    </g>
    <g data-path="card" transform="translate(20 60)">
      <rect data-path="card.bg" width="90" height="40" fill="#dfe6e9" stroke="#000000" stroke-width="1"/>
      <g data-path="card.label" transform="translate(10 10)" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#000000">
        <text x="0" y="11.977" xml:space="preserve">Overflowing label</text>
      </g>
    </g>
    <rect data-path="west_box" transform="translate(20 140)" width="60" height="40" fill="#ffeaa7" stroke="#000000" stroke-width="1"/>
    <rect data-path="blocker" transform="translate(180 130)" width="50" height="60" fill="#fab1a0" stroke="#000000" stroke-width="1"/>
    <rect data-path="east_box" transform="translate(340 140)" width="60" height="40" fill="#ffeaa7" stroke="#000000" stroke-width="1"/>
    <polyline data-path="through" points="80,160 340,160" fill="none" stroke="#000000" stroke-width="1"/>
  </g>
</svg>

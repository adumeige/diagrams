format: diagrams/0.1
viewport: {width: 420, height: 200}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: tight
      shape: text
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: This line is too long
      font_size: 14
      fill: "#000000"
      text_align: start
      width: 60
      wrap: false
    - id: card
      layout: free
      layer: default
      at: {x: 20, y: 60}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: bg
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 90
          height: 40
          corner_radius: 0
          fill: "#dfe6e9"
          stroke: "#000000"
          stroke_width: 1
        - id: label
          shape: text
          layer: default
          at: {x: 10, y: 10}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          text: Overflowing label
          font_size: 14
          fill: "#000000"
          text_align: start
          wrap: false
    - id: west_box
      shape: rect
      layer: default
      at: {x: 20, y: 140}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 60
      height: 40
      corner_radius: 0
      fill: "#ffeaa7"
      stroke: "#000000"
      stroke_width: 1
    - id: blocker
      shape: rect
      layer: default
      at: {x: 180, y: 130}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 50
      height: 60
      corner_radius: 0
      fill: "#fab1a0"
      stroke: "#000000"
      stroke_width: 1
    - id: east_box
      shape: rect
      layer: default
      at: {x: 340, y: 140}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 60
      height: 40
      corner_radius: 0
      fill: "#ffeaa7"
      stroke: "#000000"
      stroke_width: 1
    - id: through
      shape: connector
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      from: west_box
      to: east_box
      route: straight
      marker_start: none
      marker_end: none
      stroke: "#000000"
      stroke_width: 1

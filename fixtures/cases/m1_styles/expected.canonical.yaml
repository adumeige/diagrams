format: diagrams/0.1
viewport: {width: 420, height: 220}
imports: {paper: ../../../themes/paper.yaml}
base_theme: paper
styles:
  pill: {corner_radius: 18, fill: {ref: theme.primary}, stroke_width: 0}
  label: {fill: "#ffffff", font_size: 15, text_align: center}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: card
      shape: rect
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      style: paper.card
      width: 180
      height: 100
    - id: caption
      shape: text
      layer: default
      at: {x: 20, y: 130}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      style: paper.caption
      text: "style: paper.card"
      text_align: start
      wrap: false
    - id: card_pill
      shape: rect
      layer: default
      at: {x: 220, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      style: [paper.card, pill]
      width: 180
      height: 100
    - id: own_fill
      shape: rect
      layer: default
      at: {x: 220, y: 150}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      style: pill
      width: 180
      height: 36
      fill: "#00796b"
      stroke: "#000000"
    - id: own_label
      shape: text
      layer: default
      at: {x: 220, y: 158}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      style: label
      text: node value wins
      width: 180
      wrap: false
    - id: unstyled
      shape: ellipse
      layer: default
      at: {x: 20, y: 160}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 120
      height: 40
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1

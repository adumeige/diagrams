# Named styles (spec section 10): document styles by bare name, theme styles through their alias,
# a list of styles (later wins), and precedence: node value, then style, then default.
format: diagrams/0.1
viewport: {width: 420, height: 220}
imports:
  paper: ../../../themes/paper.yaml
base_theme: paper
styles:
  pill: {corner_radius: 18, fill: "=theme.primary", stroke_width: 0}
  label: {fill: "#ffffff", font_size: 15, text_align: center}
scene:
  children:
    - {shape: rect, id: card, at: {x: 20, y: 20}, width: 180, height: 100, style: paper.card}
    - {shape: text, id: caption, at: {x: 20, y: 130}, text: "style: paper.card", style: paper.caption}
    - {shape: rect, id: card_pill, at: {x: 220, y: 20}, width: 180, height: 100, style: [paper.card, pill]}
    - {shape: rect, id: own_fill, at: {x: 220, y: 150}, width: 180, height: 36, style: pill, fill: "#00796b"}
    - {shape: text, id: own_label, at: {x: 220, y: 158}, width: 180, text: "node value wins", style: label}
    - {shape: ellipse, id: unstyled, at: {x: 20, y: 160}, width: 120, height: 40}

format: diagrams/0.1
viewport: {width: 200, height: 200}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: g
      layout: layered
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      direction: sideways
      rank_gap: wide
      ordering: random
      children:
        - id: a
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          rank: middle
          width: 10
          height: 10
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#000000"
          stroke_width: 1
        - id: b
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          rank: {same_as: nowhere}
          width: 10
          height: 10
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#000000"
          stroke_width: 1
        - id: c
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          rank: {below: a}
          width: 10
          height: 10
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#000000"
          stroke_width: 1
        - id: n4
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          rank: 2
          width: 10
          height: 10
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#000000"
          stroke_width: 1
        - id: k
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          from: a
          to: b
          route: curved
          constrain: maybe
          marker_start: none
          marker_end: none
          stroke: "#000000"
          stroke_width: 1
        - id: t
          shape: text
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          attach: {to: a.label}
          text: x
          font_size: 16
          fill: "#000000"
          text_align: start
          wrap: false
    - id: h
      layout: dagre
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children: []
    - id: f
      layout: force
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      seed: -1
      link_distance: far
      children: []
    - id: f2
      layout: force
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      seed: 1.5
      children:
        - id: p
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          pinned: here
          width: 10
          height: 10
          corner_radius: 0
          fill: "#ffffff"
          stroke: "#000000"
          stroke_width: 1
    - id: r
      layout: tree
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      radial: maybe
      children: []

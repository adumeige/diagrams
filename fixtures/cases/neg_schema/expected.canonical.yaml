format: diagrams/0.1
viewport: {width: 200, height: 100}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: box
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 10
      corner_radius: 0
      fill: null
      stroke: "#000000"
      stroke_width: 1
      colour: "#ff0000"
    - id: box
      shape: circle
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      radius: "=10 +"
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - {shape: hexagon, id: odd}
    - id: Bad
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 1
      height: 1
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: stub
      shape: line
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      points: [{x: 0, y: 0}]
      stroke: "#000000"
      stroke_width: 1
    - id: width
      shape: text
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: hi
      font_size: 16
      fill: "#000000"
      text_align: start
      wrap: false

# Structural errors, each with a source position.
format: diagrams/0.1
viewport: {width: 200, height: 100}
scene:
  children:
    - shape: rect
      id: box
      width: 10
      fill: #ff0000
      colour: "#ff0000"
    - {shape: circle, id: box, radius: "=10 +"}
    - {shape: hexagon, id: odd}
    - {shape: rect, id: Bad, width: 1, height: 1}
    - {shape: line, id: stub, points: [{x: 0, y: 0}]}
    - {shape: text, id: width, text: hi}

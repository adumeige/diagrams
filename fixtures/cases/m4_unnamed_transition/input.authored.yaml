# Transition frames match nodes by path, but the parts of unnamed template instances share theirs
# (each link below has a `line`): they are matched by locator instead, so in the frame each arrow
# stays in place and only its color changes.
format: diagrams/0.1
viewport: {width: 360, height: 200}
imports:
  deck: ../../../libs/deck.yaml
  paper: ../../../themes/paper.yaml
base_theme: paper
scene:
  states:
    defaults: {duration: 0.5, ease: linear}
    sequence:
      - {id: one}
      - {id: two, set: {hot.fill: "#e17055"}}
  children:
    - {shape: rect, id: a, at: {x: 20, y: 20}, width: 80, height: 40, fill: "#b2bec3", stroke_width: 0}
    - {shape: rect, id: b, at: {x: 260, y: 20}, width: 80, height: 40, fill: "#b2bec3", stroke_width: 0}
    - {shape: rect, id: hot, at: {x: 140, y: 140}, width: 80, height: 40, fill: "#b2bec3", stroke_width: 0}
    - {use: deck.link, from: a, to: b}
    - {use: deck.link, from: b, to: hot}
    - {use: deck.link, from: hot, to: a}

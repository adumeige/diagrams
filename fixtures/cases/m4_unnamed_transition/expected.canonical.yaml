format: diagrams/0.1
viewport: {width: 360, height: 200}
imports: {deck: ../../../libs/deck.yaml, paper: ../../../themes/paper.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  states:
    defaults: {duration: 0.5, ease: linear}
    cumulative: false
    sequence: [{id: one}, {id: two, set: {hot.fill: "#e17055"}}]
  children:
    - id: a
      shape: rect
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 80
      height: 40
      corner_radius: 0
      fill: "#b2bec3"
      stroke: "#000000"
      stroke_width: 0
    - id: b
      shape: rect
      layer: default
      at: {x: 260, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 80
      height: 40
      corner_radius: 0
      fill: "#b2bec3"
      stroke: "#000000"
      stroke_width: 0
    - id: hot
      shape: rect
      layer: default
      at: {x: 140, y: 140}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 80
      height: 40
      corner_radius: 0
      fill: "#b2bec3"
      stroke: "#000000"
      stroke_width: 0
    - use: deck.link
      from: a
      to: b
      label: ""
      color: "#636e72"
      label_color: "#636e72"
      width: 2
      route: straight
      label_side: south
    - use: deck.link
      from: b
      to: hot
      label: ""
      color: "#636e72"
      label_color: "#636e72"
      width: 2
      route: straight
      label_side: south
    - use: deck.link
      from: hot
      to: a
      label: ""
      color: "#636e72"
      label_color: "#636e72"
      width: 2
      route: straight
      label_side: south

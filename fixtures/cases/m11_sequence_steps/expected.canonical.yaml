format: diagrams/0.1
title: "UML: check out"
viewport: {width: 900, height: 860}
imports: {uml: ../../../libs/uml.yaml, paper: ../../../themes/paper.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  layers: [backdrop, default, fragments, messages, refs]
  children:
    - shape: rect
      layer: backdrop
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: {ref: viewport.width}
      height: {ref: viewport.height}
      corner_radius: 0
      fill: {ref: theme.background}
      stroke: "#000000"
      stroke_width: 0
    - id: sd
      use: uml.frame
      at: {x: 30, y: 24}
      kind: sd
      name: Check out
      children:
        - layout: row
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          gap: 100
          align: end
          children:
            - id: buyer
              use: uml.lifeline
              name: Customer
              actor: true
              created: false
              destroyed: false
              steps:
                - {m1: ""}
                - {m2: ""}
                - {m3: ""}
                - {m4: ""}
                - {m5: ""}
                - {m6: ""}
                - {m7: ""}
                - {m8: ""}
                - {m9: ""}
                - {m10: ""}
                - {m11: ""}
                - {m12: ""}
                - {m13: ""}
                - {m14: ""}
                - {m15: ""}
                - {m16: ""}
                - {m17: ""}
              step_height: 36
              tail: true
            - id: web
              use: uml.lifeline
              name: ": Storefront"
              actor: false
              created: false
              destroyed: false
              steps:
                - {m1: start}
                - {m2: "on"}
                - {m3: "on"}
                - {m4: "on"}
                - {m5: "on"}
                - {m6: "on"}
                - {m7: "on"}
                - {m8: "on"}
                - {m9: "on"}
                - {m10: "on"}
                - {m11: "on"}
                - {m12: "on"}
                - {m13: "on"}
                - {m14: "on"}
                - {m15: "on"}
                - {m16: end}
                - {m17: ""}
              step_height: 36
              tail: true
            - id: orders
              use: uml.lifeline
              name: ": Orders"
              actor: false
              created: false
              destroyed: false
              steps:
                - {m1: ""}
                - {m2: ""}
                - {m3: start}
                - {m4: "on"}
                - {m5: "on"}
                - {m6: end}
                - {m7: ""}
                - {m8: ""}
                - {m9: ""}
                - {m10: ""}
                - {m11: ""}
                - {m12: start}
                - {m13: end}
                - {m14: ""}
                - {m15: ""}
                - {m16: ""}
                - {m17: ""}
              step_height: 36
              tail: true
            - id: payment
              use: uml.lifeline
              name: "p : Payment"
              actor: false
              created: true
              destroyed: false
              steps:
                - {m1: none}
                - {m2: none}
                - {m3: none}
                - {m4: none}
                - {m5: none}
                - {m6: none}
                - {m7: none}
                - {m8: create}
                - {m9: start}
                - {m10: "on"}
                - {m11: end}
                - {m12: ""}
                - {m13: ""}
                - {m14: ""}
                - {m15: ""}
                - {m16: destroy}
                - {m17: none}
              step_height: 36
              tail: false
            - id: bank
              use: uml.lifeline
              name: ": Bank"
              actor: false
              created: false
              destroyed: false
              steps:
                - {m1: ""}
                - {m2: ""}
                - {m3: ""}
                - {m4: ""}
                - {m5: ""}
                - {m6: ""}
                - {m7: ""}
                - {m8: ""}
                - {m9: ""}
                - {m10: once}
                - {m11: ""}
                - {m12: ""}
                - {m13: ""}
                - {m14: ""}
                - {m15: ""}
                - {m16: ""}
                - {m17: ""}
              step_height: 36
              tail: true
    - id: each_line
      use: uml.fragment
      layer: fragments
      at:
        x: {add: [{ref: sd.buyer.right}, 8]}
        y: {add: [{ref: "sd.web.step[m2].top"}, 6]}
      operator: loop
      guard: for each line
      width: {add: [{sub: [{ref: sd.orders.right}, {ref: sd.buyer.right}]}, 76]}
      height:
        sub: [{sub: [{ref: "sd.web.step[m6].bottom"}, {ref: "sd.web.step[m2].top"}]}, 4]
      covers: []
    - id: paid
      use: uml.fragment
      layer: fragments
      at:
        x: {sub: [{ref: sd.buyer.right}, 4]}
        y: {add: [{ref: "sd.web.step[m7].top"}, 6]}
      operator: alt
      guard: card accepted
      width: {add: [{sub: [{ref: sd.bank.right}, {ref: sd.buyer.right}]}, 12]}
      height:
        sub: [{sub: [{ref: "sd.web.step[m16].bottom"}, {ref: "sd.web.step[m7].top"}]}, 4]
      covers: []
      children:
        - use: uml.operand
          at: {x: 0, y: {add: [{sub: [{ref: "sd.web.step[m14].top"}, {ref: paid.top}]}, 8]}}
          guard: else
          width: {add: [{sub: [{ref: sd.bank.right}, {ref: sd.buyer.right}]}, 12]}
    - id: notify
      use: uml.interaction_use
      layer: refs
      at:
        x: {sub: [{ref: sd.buyer.left}, 10]}
        y: {add: [{ref: "sd.web.step[m17].top"}, 8]}
      name: Send confirmation
      covers: []
      width: {add: [{sub: [{ref: sd.web.right}, {ref: sd.buyer.left}]}, 20]}
      height: 30
    - use: uml.message
      layer: messages
      from: "sd.buyer.step[m1]"
      to: "sd.web.step[m1]"
      label: checkout()
      kind: sync
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.web.step[m3]"
      to: "sd.orders.step[m3]"
      label: addLine(item)
      kind: sync
      parallel: false
    - use: uml.self_message
      layer: messages
      attach: {anchor: north_west, to: "sd.orders.step[m4].east"}
      label: price(item)
      height: 36
      reply: false
    - use: uml.message
      layer: messages
      from: "sd.orders.step[m6]"
      to: "sd.web.step[m6]"
      label: line
      kind: reply
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.web.step[m8]"
      to: "sd.payment.step[m8]"
      label: new(total)
      kind: create
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.web.step[m9]"
      to: "sd.payment.step[m9]"
      label: authorize()
      kind: sync
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.payment.step[m10]"
      to: "sd.bank.step[m10]"
      label: charge(card)
      kind: async
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.payment.step[m11]"
      to: "sd.web.step[m11]"
      label: authorized
      kind: reply
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.web.step[m12]"
      to: "sd.orders.step[m12]"
      label: place()
      kind: sync
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.orders.step[m13]"
      to: "sd.web.step[m13]"
      label: order
      kind: reply
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.web.step[m15]"
      to: "sd.buyer.step[m15]"
      label: card refused
      kind: async
      parallel: false
    - use: uml.message
      layer: messages
      from: "sd.web.step[m16]"
      to: "sd.payment.step[m16]"
      label: close()
      kind: async
      parallel: false

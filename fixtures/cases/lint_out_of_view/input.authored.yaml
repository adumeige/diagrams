# Geometric lint: nodes leaving the viewport and text too small to read.
format: diagrams/0.1
viewport: {width: 200, height: 120}
scene:
  children:
    - {shape: rect, id: inside, at: {x: 10, y: 10}, width: 50, height: 50, fill: "#74b9ff"}
    - {shape: rect, id: spill, at: {x: 160, y: 10}, width: 80, height: 50, fill: "#fab1a0"}
    - id: far
      at: {x: 400, y: 400}
      children:
        - {shape: circle, id: lost, radius: 10, fill: "#d63031"}
    - {shape: text, id: tiny, at: {x: 10, y: 80}, text: fine print, font_size: 6}

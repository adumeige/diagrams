format: diagrams/0.1
viewport: {width: 200, height: 120}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: inside
      shape: rect
      layer: default
      at: {x: 10, y: 10}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 50
      height: 50
      corner_radius: 0
      fill: "#74b9ff"
      stroke: "#000000"
      stroke_width: 1
    - id: spill
      shape: rect
      layer: default
      at: {x: 160, y: 10}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 80
      height: 50
      corner_radius: 0
      fill: "#fab1a0"
      stroke: "#000000"
      stroke_width: 1
    - id: far
      layout: free
      layer: default
      at: {x: 400, y: 400}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: lost
          shape: circle
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          radius: 10
          fill: "#d63031"
          stroke: "#000000"
          stroke_width: 1
    - id: tiny
      shape: text
      layer: default
      at: {x: 10, y: 80}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      text: fine print
      font_size: 6
      fill: "#000000"
      text_align: start
      wrap: false

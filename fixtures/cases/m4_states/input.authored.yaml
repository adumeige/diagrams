# States (spec section 11): a sequence on the scene with extends, a tree on a child node, a parent
# state that sets the child container's state, presence, a token override, a template parameter
# (the instance expands again), and a transition frame (frames.yaml).
format: diagrams/0.1
viewport: {width: 480, height: 240}
imports:
  deck: ../../../libs/deck.yaml
  paper: ../../../themes/paper.yaml
base_theme: paper
scene:
  states:
    defaults: {duration: 0.5, ease: linear}
    sequence:
      - {id: one}
      - {id: two, set: {b.present: true, a.fill: "=theme.accent", panel.state: open}}
      - {id: three, extends: two, set: {a.at.x: 200, steps.current: 2, theme.primary: "#00b894"}}
  children:
    - {shape: rect, id: a, at: {x: 40, y: 40}, width: 80, height: 50, fill: "=theme.primary", stroke_width: 0}
    - {shape: rect, id: b, present: false, at: {x: 140, y: 110}, width: 80, height: 50, fill: "#636e72", stroke_width: 0}
    - id: panel
      at: {x: 320, y: 40}
      states:
        tree:
          - id: closed
          - id: open
            set: {lid.rotation: -20, lid.fill: "#fdcb6e"}
            children:
              - {id: wide, set: {lid.width: 130}}
      children:
        - {shape: rect, id: lid, width: 100, height: 24, fill: "#b2bec3", stroke_width: 0}
    - {use: deck.progress, id: steps, steps: [a, b, c], current: 0, at: {x: 40, y: 200}}

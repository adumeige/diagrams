format: diagrams/0.1
viewport: {width: 480, height: 240}
imports: {deck: ../../../libs/deck.yaml, paper: ../../../themes/paper.yaml}
base_theme: paper
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  states:
    defaults: {duration: 0.5, ease: linear}
    cumulative: false
    sequence:
      - {id: one}
      - id: two
        set: {b.present: true, a.fill: {ref: theme.accent}, panel.state: open}
      - id: three
        extends: two
        set: {a.at.x: 200, steps.current: 2, theme.primary: "#00b894"}
  children:
    - id: a
      shape: rect
      layer: default
      at: {x: 40, y: 40}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 80
      height: 50
      corner_radius: 0
      fill: {ref: theme.primary}
      stroke: "#000000"
      stroke_width: 0
    - id: b
      shape: rect
      layer: default
      at: {x: 140, y: 110}
      rotation: 0
      scale: 1
      opacity: 1
      present: false
      width: 80
      height: 50
      corner_radius: 0
      fill: "#636e72"
      stroke: "#000000"
      stroke_width: 0
    - id: panel
      layout: free
      layer: default
      at: {x: 320, y: 40}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      states:
        defaults: {duration: 0.5, ease: in_out}
        tree:
          - {id: closed}
          - id: open
            set: {lid.rotation: -20, lid.fill: "#fdcb6e"}
            children: [{id: wide, set: {lid.width: 130}}]
      children:
        - id: lid
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          width: 100
          height: 24
          corner_radius: 0
          fill: "#b2bec3"
          stroke: "#000000"
          stroke_width: 0
    - id: steps
      use: deck.progress
      at: {x: 40, y: 200}
      steps: [a, b, c]
      current: 0

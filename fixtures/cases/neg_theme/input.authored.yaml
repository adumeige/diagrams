# Theme, style and import errors.
format: diagrams/0.1
viewport: {width: 200, height: 100}
imports:
  paper: ../../../themes/paper.yaml
  missing: ./no_such_theme.yaml
base_theme: paperr
styles:
  bad: {id: x, fill: 12}
scene:
  children:
    - {shape: rect, id: a, width: 10, height: 10, fill: "=theme.secondary"}
    - {shape: rect, id: b, width: 10, height: 10, style: card}
    - {shape: text, id: c, text: hi, font: serif}
    - {shape: rect, id: node_d, width: 10, height: 10, theme: nope}
    - id: e
      theme: {primary: [1, 2]}
      children:
        - {shape: rect, id: f, width: 10, height: 10, fill: "=theme.colors.red"}

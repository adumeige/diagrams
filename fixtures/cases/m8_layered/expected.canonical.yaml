          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: {same_as: emit}
          width: 110
          height: 40
        - id: finish
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 110
          height: 40
        - id: audit
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          rank: last
          width: 110
          height: 40
        - id: e1
          shape: connector
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: edge
          from: read
          to: parse
          route: layout
          marker_start: none
        - id: e2

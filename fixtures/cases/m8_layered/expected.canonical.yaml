format: diagrams/0.1
viewport: {width: 900, height: 620}
styles:
  step: {fill: "#dfe6e9", stroke: "#2d3436", stroke_width: 1.5, corner_radius: 6}
  edge: {stroke: "#2d3436", stroke_width: 1.5, marker_end: arrow}
  aside: {stroke: "#0984e3", stroke_width: 1.5, marker_end: arrow}
  caption: {font_size: 12, fill: "#636e72"}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: flow
      layout: layered
      layer: default
      at: {x: 20, y: 20}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      children:
        - id: read
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 110
          height: 40
        - id: parse
          shape: rect
          layer: default
          at: {x: 0, y: 0}
          rotation: 0
          scale: 1
          opacity: 1
          present: true
          style: step
          width: 110
          height: 40
        - id: check

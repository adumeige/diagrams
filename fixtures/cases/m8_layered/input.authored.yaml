# The layered layout (graph layouts addendum, section 4): ranks that follow the edges, a cycle, an
# edge across several ranks, a self-loop, two edges between the same nodes, labels with reserved
# room, the hints `rank` and `constrain`, the options `direction`, `ordering`, `gap` and `rank_gap`,
# and connectors that keep their own router or a fixed anchor.
format: diagrams/0.1
viewport: {width: 900, height: 620}
styles:
  step: {fill: "#dfe6e9", stroke: "#2d3436", stroke_width: 1.5, corner_radius: 6}
  edge: {stroke: "#2d3436", stroke_width: 1.5, marker_end: arrow}
  aside: {stroke: "#0984e3", stroke_width: 1.5, marker_end: arrow}
  caption: {font_size: 12, fill: "#636e72"}
scene:
  children:
    - id: flow
      at: {x: 20, y: 20}
      layout: layered
      children:
        - {shape: rect, id: read, width: 110, height: 40, style: step}
        - {shape: rect, id: parse, width: 110, height: 40, style: step}
        - {shape: rect, id: check, width: 110, height: 40, style: step}
        - {shape: rect, id: repair, width: 110, height: 40, style: step}
        - {shape: rect, id: emit, width: 110, height: 40, style: step}
        - {shape: rect, id: report, width: 110, height: 40, style: step, rank: {same_as: emit}}
        - {shape: rect, id: finish, width: 110, height: 40, style: step}
        - {shape: rect, id: audit, width: 110, height: 40, style: step, rank: last}
        - {shape: connector, id: e1, from: read, to: parse, style: edge}
        - {shape: connector, id: e2, from: parse, to: check, style: edge}
        - {shape: connector, id: e3, from: check, to: repair, style: edge}
        # closes a cycle: the layout draws it against the ranks
        - {shape: connector, id: e4, from: repair, to: check, style: edge}
        - {shape: connector, id: e5, from: check, to: emit, style: edge}
        # crosses three ranks: the layout routes it around what is in between
        - {shape: connector, id: e6, from: read, to: finish, style: edge}
        - {shape: connector, id: e7, from: emit, to: finish, style: edge}
        - {shape: connector, id: e8, from: parse, to: report, style: edge}
        - {shape: connector, id: again, from: emit, to: emit, style: edge}
        # drawn, without pulling `audit` under `report`
        - {shape: connector, id: e9, from: report, to: audit, style: aside, constrain: false}
        - {shape: text, text: invalid, style: caption, attach: {to: e3.label}}
        - {shape: text, text: skip, style: caption, attach: {to: e6.label}}
    - id: pipeline
      at: {x: 480, y: 500}
      layout: layered
      direction: right
      ordering: declared
      gap: 24
      rank_gap: 50
      children:
        - {shape: rect, id: source, width: 80, height: 36, style: step}
        - {shape: rect, id: build, width: 80, height: 36, style: step}
        - {shape: rect, id: test, width: 80, height: 36, style: step}
        - {shape: rect, id: ship, width: 80, height: 36, style: step}
        - {shape: connector, from: source, to: build, style: edge}
        # fixed anchors end the route where the author put them
        - {shape: connector, from: source.south, to: test.west, style: edge}
        # two edges between the same nodes are drawn apart
        - {shape: connector, from: build, to: ship, style: edge}
        - {shape: connector, from: build, to: ship, style: aside}
        # this connector keeps its own router: the layout still places its ends
        - {shape: connector, from: test, to: ship, style: edge, route: orthogonal}

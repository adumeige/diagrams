# Cycles through attachments and geometry references are found while resolving.
format: diagrams/0.1
viewport: {width: 300, height: 200}
scene:
  children:
    - {shape: rect, id: a, width: 40, height: 40, attach: {anchor: west, to: b, gap: 10}}
    - {shape: rect, id: b, width: 40, height: 40, attach: {anchor: west, to: a, gap: 10}}
    - {shape: rect, id: c, at: {x: "=dd.right", y: 100}, width: 40, height: 40}
    - {shape: rect, id: dd, at: {x: "=c.left - 50", y: 100}, width: "=c.width", height: 40}
    - {shape: rect, id: e, at: {x: 10, y: 150}, width: "=e.width + 1", height: 20}

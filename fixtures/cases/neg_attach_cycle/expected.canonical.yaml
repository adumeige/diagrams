format: diagrams/0.1
viewport: {width: 300, height: 200}
scene:
  layout: free
  rotation: 0
  scale: 1
  opacity: 1
  present: true
  children:
    - id: a
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {anchor: west, to: b, gap: 10}
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: b
      shape: rect
      layer: default
      at: {x: 0, y: 0}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      attach: {anchor: west, to: a, gap: 10}
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: c
      shape: rect
      layer: default
      at: {x: {ref: dd.right}, y: 100}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: 40
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: dd
      shape: rect
      layer: default
      at: {x: {sub: [{ref: c.left}, 50]}, y: 100}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: {ref: c.width}
      height: 40
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1
    - id: e
      shape: rect
      layer: default
      at: {x: 10, y: 150}
      rotation: 0
      scale: 1
      opacity: 1
      present: true
      width: {add: [{ref: e.width}, 1]}
      height: 20
      corner_radius: 0
      fill: "#ffffff"
      stroke: "#000000"
      stroke_width: 1

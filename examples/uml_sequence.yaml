# UML sequence diagram (libs/uml.yaml) in a sequence container (docs/sequence-layout.md): the
# layout places the lifelines side by side and the messages in rows, in the order they are
# written. Fragments hold their messages; activations name the messages they span. No coordinate,
# no step and no expression.
#   diagrams render examples/uml_sequence.yaml --out uml_sequence.png --scale 2
format: diagrams/0.1
title: "UML: check out"
viewport: {width: 820, height: 800}
imports:
  uml: ../libs/uml.yaml
  paper: ../themes/paper.yaml
base_theme: paper
scene:
  layers: [backdrop, default]
  children:
    - {shape: rect, layer: backdrop, width: "=viewport.width", height: "=viewport.height", fill: "=theme.background", stroke_width: 0}
    - use: uml.frame
      id: sd
      at: {x: 30, y: 24}
      kind: sd
      name: Check out
      children:
        - id: talk
          layout: sequence
          children:
            - {use: uml.lifeline, id: buyer, name: Customer, actor: true}
            - {use: uml.lifeline, id: web, name: ": Storefront"}
            - {use: uml.lifeline, id: orders, name: ": Orders"}
            - {use: uml.lifeline, id: payment, name: "p : Payment", created: true, destroyed: true}
            - {use: uml.lifeline, id: bank, name: ": Bank"}
            # activations next, so that the fragments and messages after them paint on top
            - {use: uml.activation, "on": web, from: checkout, to: close}
            - {use: uml.activation, "on": orders, from: add, to: line}
            - {use: uml.activation, "on": orders, from: place, to: placed}
            - {use: uml.activation, "on": payment, from: authorize, to: authorized}
            - {use: uml.activation, "on": bank, from: charge, to: charge}

            - {use: uml.message, id: checkout, from: buyer, to: web, label: "checkout()"}
            - use: uml.fragment
              operator: loop
              guard: for each line
              children:
                - {use: uml.message, id: add, from: web, to: orders, label: "addLine(item)"}
                - {use: uml.message, id: price, from: orders, to: orders, label: price(item)}
                - {use: uml.message, id: line, from: orders, to: web, label: line, kind: reply}
            - use: uml.fragment
              operator: alt
              guard: card accepted
              children:
                - {use: uml.message, id: create, from: web, to: payment, label: "new(total)", kind: create}
                - {use: uml.message, id: authorize, from: web, to: payment, label: "authorize()"}
                - {use: uml.message, id: charge, from: payment, to: bank, label: "charge(card)", kind: async}
                - {use: uml.message, id: authorized, from: payment, to: web, label: authorized, kind: reply}
                - {use: uml.message, id: place, from: web, to: orders, label: "place()"}
                - {use: uml.message, id: placed, from: orders, to: web, label: order, kind: reply}
                - use: uml.operand
                  guard: else
                  children:
                    - {use: uml.message, id: refused, from: web, to: buyer, label: card refused, kind: async}
            - {use: uml.message, id: close, from: web, to: payment, label: "close()", kind: async}
            - {use: uml.interaction_use, name: Send confirmation, covers: [buyer, web]}
